<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#f2f6fd" />
<title>刷题小站 · by 来一块小饼干</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation}
:root{
  --bg:#f3f7fc;
  --card:#ffffff;
  --ink:#182a3a;
  --muted:#74879a;
  --line:#e2eaf2;
  --accent:#2f6bb0;
  --accent-dark:#245488;
  --soft:#e9f1fb;
  --green:#1f7a55;
  --green-soft:#e8f5ee;
  --red:#b8544c;
  --red-soft:#fbecea;
  --amber:#a2762f;
  --amber-soft:#fdf4e3;
  --indigo:#5b5fb0;
  --indigo-soft:#eef0fb;
  --shadow:0 1px 2px rgba(24,42,58,.04),0 14px 34px -24px rgba(24,42,58,.4);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,#eaf2fc 0%,#f6f9fc 280px,#f6f9fc 100%);line-height:1.66;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(44px + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:"Noto Serif SC",Georgia,serif;font-weight:600;letter-spacing:.01em;margin:0}
button{font-family:inherit;color:inherit;font-size:15px;background:none;border:none;padding:0}
a{color:var(--accent)}
::selection{background:#cfe1f5}

/* ---------- 基础 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.topbar h2{font-size:19px;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.byline-sm{font-size:9.5px;color:#b2c4d6;white-space:nowrap;flex:0 0 auto;letter-spacing:0;margin-left:-14px}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:16px;color:var(--muted);line-height:1;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.94)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 15px;cursor:pointer;font-weight:500;transition:transform .1s,background .2s,color .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-dark)}
.btn.soft{background:var(--soft);border-color:#d8e5f4;color:var(--accent-dark)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--red);border-color:#f0d6d3}
.btn.block{display:flex;width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:#b06a62}
.input,textarea.input,select.input{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;line-height:1.6}
textarea.input{resize:vertical}
.input:focus{border-color:#8fb4da;box-shadow:0 0 0 3px rgba(47,107,176,.1)}
.field{margin-bottom:15px}
.field-label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px 2px;letter-spacing:.02em}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.page-title{font-size:27px;line-height:1.3;word-break:break-word}
.stat-line{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:6px;font-weight:500;line-height:1.7;white-space:nowrap}
.t-single{background:var(--soft);color:var(--accent-dark)}
.t-multi{background:var(--indigo-soft);color:var(--indigo)}
.t-judge{background:var(--green-soft);color:var(--green)}
.t-short{background:var(--amber-soft);color:var(--amber)}
.tag.t-custom{background:#eef1f7;color:#4a5f86}
.tag.ghost{background:#f2f5f9;color:var(--muted)}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.sec-head h2{font-size:16px}
.sec-head span{font-size:12px}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty .ico{width:54px;height:54px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13px;margin:0 0 18px}

/* ---------- 首页 ---------- */
.hero{margin:8px 0 20px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.byline{display:inline-block;margin-left:9px;font-size:11.5px;font-weight:400;letter-spacing:.02em;color:var(--muted);position:relative;top:-2px}
.hero-mark{font-family:"Noto Serif SC",serif;font-size:10px;letter-spacing:.3em;color:var(--accent);opacity:.7;margin-bottom:6px}
.hero h1{font-size:30px;line-height:1.25}
.profile-pill{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 12px 6px 14px;border-radius:22px;background:rgba(255,255,255,.8);border:1px solid var(--line);font-size:13px;color:#3c5165;cursor:pointer}
.profile-pill i{color:#c3d2e2;font-style:normal}
.profile-pill b{font-size:11.5px;color:var(--accent);font-weight:500;background:var(--soft);padding:2px 7px;border-radius:10px}
.searchbar{display:flex;align-items:center;gap:9px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);margin:4px 0 6px;text-align:left}
.course-list{display:grid;gap:10px}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);position:relative}
.cc-hit{cursor:pointer}
.cc-adj{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#f4f8fd;border:1px solid var(--line);color:var(--muted);font-size:13px;display:grid;place-items:center;cursor:pointer;line-height:1}
.cc-adj:active{background:var(--soft)}
.cc-wrong{font-size:11px;color:var(--red);background:var(--red-soft);border:1px solid #f0d6d3;border-radius:20px;padding:1px 8px;margin-left:6px;cursor:pointer}
.cc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:30px}
.cc-name{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600}
.cc-arrow{color:#b9c8d8;font-size:17px}
.cc-meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.cc-bar{height:3px;background:#eef3f8;border-radius:3px;margin-top:11px;overflow:hidden}
.cc-bar i{display:block;height:100%;background:linear-gradient(90deg,#4d86c4,#2f6bb0);border-radius:3px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px}
.book-tabs{display:flex;gap:6px;margin:14px 0 10px}
.book-tabs button{flex:1;padding:8px 3px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.book-tabs button.on{background:var(--soft);border-color:#bcd6f0;color:var(--accent-dark);font-weight:500}
.quick{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 3px;cursor:pointer;color:#3f566b;font-size:11.5px;line-height:1.3;text-align:center;box-shadow:0 1px 2px rgba(24,42,58,.04)}
.quick:active{background:#fafcff}
.quick svg{color:var(--accent)}
.tag.fav{background:#fdf3e2;color:#a9762a;border:1px solid #eed9b6}
.qitem,.sr-item,.q-main{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.p-stem,.exp,.short-box{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.mark-bar,.ask,.p-nav,.opts button{-webkit-user-select:none;user-select:none}
/* 草稿层 */
.draft-layer{position:absolute;inset:0;z-index:20;background:rgba(255,255,255,.01);border-radius:14px;display:flex;flex-direction:column}
.draft-layer .draft-bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 9px;box-shadow:0 2px 10px rgba(24,42,58,.12);font-size:11.5px;color:var(--muted);z-index:2}
.draft-layer .draft-bar span{flex:1}
.draft-layer .draft-bar button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;color:#3f566b}
.draft-layer .draft-bar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#draftCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
.log-row{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:8px;font-size:13px;cursor:pointer;text-align:left;width:100%}
.log-row .lr-main{flex:1;min-width:0}
.log-row .lr-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.log-row .lr-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.log-row .lr-score{font-size:12px;color:var(--accent);flex:none}
.howto{margin-top:30px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px}
.howto .step{display:flex;gap:11px;align-items:baseline;font-size:12.5px;color:var(--muted);line-height:1.6}
.howto .step b{font-family:"Noto Serif SC",serif;font-size:10.5px;letter-spacing:.12em;color:var(--accent);opacity:.8;flex:none;width:20px}

/* ---------- 目录 ---------- */
.group-title{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;font-size:12.5px;color:var(--muted)}
.group-title b{font-family:"Noto Serif SC",serif;font-size:14px;color:var(--ink);font-weight:600}
.course-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;text-align:left;cursor:pointer}
.course-row .cr-main{flex:1;min-width:0}
.course-row .cr-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-row .cr-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.course-row .cr-arrow{color:#b9c8d8}

/* ---------- 课程 ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.actions .btn{flex:1 1 calc(50% - 4px);min-width:0}
.chapter-list{margin-top:14px;display:grid;gap:9px}
.folder-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:14px 2px 2px}
.folder-head b{font-family:"Noto Serif SC",serif;font-size:12.5px;color:#3d5266;font-weight:600}
.folder-head .n{font-size:11px;color:var(--muted)}
.chapter-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;text-align:left;width:100%;cursor:pointer}
.chapter-row .ch-main{flex:1;min-width:0}
.chapter-row .ch-name{font-weight:500;display:flex;align-items:center;gap:7px}
.chapter-row .ch-name .num{font-family:"Noto Serif SC",serif;font-size:11px;color:var(--muted);flex:none}
.chapter-row .ch-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);border-top:1px solid #e3edf6;box-shadow:0 -8px 24px rgba(40,80,140,.1);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;backdrop-filter:blur(10px)}
.selbar .t{font-size:12.5px;color:#7b8fa3;flex:none}
.selbar .t b{color:#2f6fb2;font-size:16px;margin:0 2px}
.selbar .btn{flex:1;justify-content:center;min-width:0;padding:9px 4px;font-size:12.5px}
.danger-zone{margin-top:26px;display:flex;gap:16px;justify-content:center}

/* ---------- 筛选 ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin-top:12px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;font-size:12.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- 题目列表 ---------- */
.qlist{display:grid;gap:9px;margin-top:4px}
.qitem.sel{border-color:#8fbde8;background:#f3f9ff;box-shadow:inset 0 0 0 1.5px #8fbde8}
.selmark{position:absolute;right:12px;bottom:10px;width:20px;height:20px;border-radius:50%;border:1.4px solid #cfe0ef;background:#fff;color:#2f6fb2;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.qitem{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(24,42,58,.03);width:100%}
.qitem:active{background:#fbfdff}
.qi-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.qi-stat{margin-left:auto;font-size:11px;color:var(--muted)}
.qi-stem{font-size:14px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.qi-imgs{display:flex;gap:4px;margin-top:8px}
.qi-imgs img{width:46px;height:46px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}

/* ---------- 题目详情 ---------- */
.q-stem-detail{font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.72;font-weight:600;white-space:pre-wrap;word-break:break-word}
.q-imgs{display:grid;gap:9px;margin-top:14px}
.q-imgs img{width:100%;max-height:56vh;object-fit:contain;background:#f7fafd;border-radius:12px;border:1px solid var(--line);display:block}
.d-opts{margin-top:16px}
.d-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:14.5px;line-height:1.6}
.d-opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #d7e1eb;display:grid;place-items:center;font-size:11.5px;color:var(--muted);margin-top:1px}
.d-opt.ans{border-color:#a9cdb8;background:var(--green-soft)}
.d-opt.ans .k{background:var(--green);border-color:var(--green);color:#fff}
.hist-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#a9807a;background:#fdf4f2;border:1px solid #f2dcd7;border-radius:13px;padding:8px 13px;line-height:1.5}
.hist-line b{color:#b8543f;font-weight:600}
.hist-line .hi{color:#bfa19b}
.tag.pick{color:#b8543f;background:var(--red-soft)}
.ans-line{font-size:13.5px;margin-top:12px;color:#44586b}
.ans-line b{color:var(--green);font-size:15px;font-family:"Noto Serif SC",serif}
.exp-block{margin-top:14px;background:#fbfcfe;border:1px dashed #dbe6f1;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;color:#3d5266}
.exp-block .lbl{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.08em;color:var(--accent);margin-bottom:7px}
.exp-block .lbl button{font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;letter-spacing:0}
.q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.q-actions .btn{flex:1;min-width:94px}

/* ---------- 导入 ---------- */
.drop{display:block;background:var(--card);border:1.5px dashed #c9d9e9;border-radius:16px;padding:26px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.drop:active{background:#fbfdff}
.drop .di{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 10px}
.drop h3{font-size:15.5px}
.drop p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
textarea#pasteText{min-height:160px;font-size:16px;line-height:1.7}
.fmt{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.fmt summary{cursor:pointer;padding:13px 0;font-size:13.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
.fmt summary::-webkit-details-marker{display:none}
.fmt summary::after{content:"＋";color:var(--muted);font-weight:400}
.fmt[open] summary::after{content:"－"}
.fmt-body{padding:0 0 16px;font-size:12.8px;color:#4d6274;line-height:1.8}
.fmt-body pre{background:#f5f8fc;border:1px solid #e8eff7;border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.65;color:#33485c;white-space:pre}
.place-card{background:#eef5fd;border:1px solid #d8e7f7;border-radius:13px;padding:11px 14px;font-size:12.5px;color:#3a5a7a;margin-bottom:16px;line-height:1.75}
.place-card b{color:var(--accent-dark)}
.summary{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--accent-dark)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.gray{background:#f2f5f9;color:var(--muted)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:10px}
.qc-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.qc-head .num{font-family:"Noto Serif SC",serif;font-size:11px;color:var(--muted)}
.qc-stem{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.qc-opts{list-style:none;margin:8px 0 0;padding:0;font-size:13px;color:#43596c}
.qc-opts li{padding:1px 0;display:flex;gap:7px}
.qc-opts li b{color:var(--muted);font-weight:500;font-size:12px;width:12px;flex:none}
.qc-opts li.ans{color:var(--green)}
.qc-opts li.ans b{color:var(--green)}
.qc-imgs{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.qc-imgs img{width:52px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.qc-foot{display:flex;gap:14px;margin-top:10px}
.qc-foot button{font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sticky-foot{margin-top:18px}

/* ---------- 做题 ---------- */
.p-top{display:flex;align-items:center;gap:11px;margin-bottom:11px;position:relative}
.p-timer{font-family:inherit;cursor:pointer;outline:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font-size:11.5px;font-variant-numeric:tabular-nums;color:#93a7ba;background:rgba(255,255,255,.78);border:1px solid #e2ebf4;border-radius:99px;padding:2px 9px;letter-spacing:.6px;line-height:1.25}
.p-timer.run{color:#2f6fb2;border-color:#b9d4ec;background:#edf5fd;font-weight:600}
.p-timer.has{color:#4d6e8f;border-color:#d7e5f2}
.timer-chip{flex:0 0 auto;font-size:11.5px;color:#93a7ba;border:1px solid #e2ebf4;background:#fff;border-radius:99px;padding:5px 10px;display:flex;align-items:center;gap:4px;line-height:1}
.timer-chip.on{color:#2f6fb2;border-color:#b9d4ec;background:#edf5fd}
.p-title{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idk{display:block;width:100%;margin-top:10px;padding:11px 10px;border:1px dashed #dbe6f1;background:#fbfdff;color:#7d94a9;border-radius:12px;font-size:12.5px;font-family:inherit;line-height:1.2}
.idk:active{background:#f1f7fd}
.regrade{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:11px 2px 0;font-size:11px;color:#9db0c3}
.regrade button{font-family:inherit;background:none;border:1px dashed #d3e1ee;color:#5b86b0;border-radius:8px;padding:5px 11px;font-size:11.5px;line-height:1.2}
.regrade button:active{background:#eff6fd}
.p-tt{flex:0 1 auto;min-width:0;max-width:calc(50% - 92px);display:flex;align-items:center}
.p-flex{flex:1 1 0;min-width:0}
.p-tt .p-title{flex:1 1 auto;max-width:100%;min-width:0}
.p-by{font-size:8.5px;color:#b9c8d7;letter-spacing:0;flex:0 0 auto;white-space:nowrap;margin-left:-4px}
.p-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.p-count b{font-family:"Noto Serif SC",serif;font-size:17px;color:var(--ink)}
.p-count.jump{background:none;border:1px solid var(--line);border-radius:9px;padding:3px 8px;cursor:pointer}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-height:46vh;overflow:auto;padding:2px}
.palette button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.palette button.done-t{background:var(--green-soft);border-color:#9cc9b4;color:#256b52}
.palette button.done-f{background:var(--red-soft);border-color:#e2b0ab;color:#a3423a}
.palette button.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.seg.impseg{margin:-4px 0 14px}
.seg.impseg button{flex:1;text-align:center;padding:8px 10px;font-size:13px}
.rep-row{font-size:12.5px;color:var(--muted);padding:8px 2px;border-bottom:1px dashed #e4ebf3;line-height:1.55}
.rep-row:last-child{border-bottom:0}
.paper-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.paper-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.paper-count{display:flex;gap:8px;align-items:center;margin-top:4px}
.paper-count input{width:86px;text-align:center;font-variant-numeric:tabular-nums}
.paper-hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
.bar{height:4px;border-radius:3px;background:#e5edf6;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4d86c4,#2f6bb0);border-radius:3px;transition:width .3s ease}
.q-main{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 17px;box-shadow:var(--shadow)}
.q-type-row{display:flex;align-items:center;gap:7px;margin-bottom:11px}
.q-type-row .idx{font-size:11.5px;color:var(--muted);margin-left:auto}
.ask{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid #c3d6e6;background:#fff;color:var(--accent);font-size:13px;font-weight:600;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;margin-left:6px}
.ask:active{background:var(--soft)}
.ask-q{font-family:"Noto Serif SC",serif;font-size:15.5px;line-height:1.7;font-weight:600;color:var(--ink);white-space:pre-wrap;background:#f6f9fd;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:11px}
.ask-line{font-size:13px;color:#3f566b;margin-bottom:6px}
.ask-line b{color:var(--ink)}
.ask-opts{margin:6px 0 10px;padding:0;list-style:none}
.ask-opts li{font-size:12.5px;line-height:1.6;padding:6px 9px;border-radius:8px;background:#f7f9fc;margin-bottom:5px;color:#5b6f80}
.ask-opts li.ok{background:var(--green-soft);color:#2c6b53}
.ask-opts li b{color:inherit}
.ask-points{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.72;color:#3f566b}
.ask-note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px;border-top:1px dashed #e4ebf3;padding-top:9px}
.tag.issue{background:#fdf3e2;color:#a9762a;border:1px solid #eed9b6}
.hl{background:transparent}
.exp-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.exp-edit{margin-left:auto;font-size:11px;color:var(--accent);background:#f4f9ff;border:1px solid #d9e8f7;border-radius:7px;padding:3px 7px;cursor:pointer}
.ask.on{background:#fff6dc;border-color:#f0d68a;color:#b8862a}
.mk-hl{background:#ffeaa0;border-radius:3px;padding:0 1px}
.mk-ul{text-decoration:underline;text-decoration-color:#e0675c;text-decoration-thickness:2px;text-underline-offset:3px}
.mk-circle{box-shadow:inset 0 0 0 1.6px #e0675c;border-radius:10px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mk-hl-ul{background:#ffeaa0;text-decoration:underline;text-decoration-color:#e0675c;text-decoration-thickness:2px;text-underline-offset:3px;border-radius:3px;padding:0 1px}
.mk-hl-circle{background:#ffeaa0;box-shadow:inset 0 0 0 1.6px #e0675c;border-radius:10px;padding:0 3px}
.mk-ul-circle{text-decoration:underline;text-decoration-color:#e0675c;text-decoration-thickness:2px;text-underline-offset:3px;box-shadow:inset 0 0 0 1.6px #e0675c;border-radius:10px;padding:0 3px}
.mk-hl-ul-circle{background:#ffeaa0;text-decoration:underline;text-decoration-color:#e0675c;text-decoration-thickness:2px;text-underline-offset:3px;box-shadow:inset 0 0 0 1.6px #e0675c;border-radius:10px;padding:0 3px}
.q-img-wrap{position:relative;display:inline-block;max-width:100%}
.q-img-wrap .x{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;background:rgba(200,55,45,.92);color:#fff;font-size:13px;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.opt.excl{opacity:.55;border-style:dashed}
.opt.excl .txt{text-decoration:line-through;text-decoration-color:#9db0c2}
.opt.excl .key{background:#eef2f7;color:#8fa3b6}
.mark-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:9px 0 0;padding:8px 10px;background:#fff;border:1px solid #e4edf6;border-radius:11px;box-shadow:0 4px 14px rgba(40,80,120,.08);font-size:12px;color:var(--muted)}
.mark-bar button{height:27px;padding:0 10px;border-radius:8px;border:1px solid #e0e9f2;background:#fbfdff;font-size:12px;cursor:pointer;color:#41596e}
.mark-bar button.hl{background:#ffeaa0;border-color:#f2dc86}
.mark-bar button.ul{text-decoration:underline;text-decoration-color:#e0675c;text-decoration-thickness:2px}
.mark-bar button.circle{box-shadow:inset 0 0 0 1.5px #e0675c;border-radius:9px}
.mark-bar .x{margin-left:auto;color:#9bafc1;background:none;border:none;font-size:14px}
.hl-y{background:#ffe9a6;border-radius:3px;box-decoration-break:clone;padding:0 1px}
.hl-r{background:#ffd4cf;border-radius:3px;box-decoration-break:clone;padding:0 1px}
.hl-b{background:#cfe4ff;border-radius:3px;box-decoration-break:clone;padding:0 1px}
.hl-ul{text-decoration:underline;text-decoration-color:#3f7fbf;text-decoration-thickness:1.5px;text-underline-offset:2.5px}
.hl-wavy{text-decoration:underline;text-decoration-style:wavy;text-decoration-color:#d9614f;text-decoration-thickness:1.5px;text-underline-offset:2.5px}
.hl-circle{border:1.6px solid #6fae90;border-radius:7px;box-decoration-break:clone;padding:0 1.5px}
.hlbtn.ul i{background:#fff;border-bottom:1.6px solid #3f7fbf;border-radius:0}
.hlbtn.wavy i{background:#fff;border-bottom:1.6px dashed #d9614f;border-radius:0}
.hlbtn.circle i{background:#fff;border:1.6px solid #6fae90;border-radius:50%}
.bk-box{margin:6px 0 12px;padding:11px 12px;background:#f5f9ff;border:1px solid #dce8f6;border-radius:12px}
.bk-t{font-size:12.5px;font-weight:600;color:#3d566f}
.bk-d{font-size:11.5px;color:var(--muted);line-height:1.6;margin:3px 0 8px}
.bk-row{display:flex;gap:8px}
.sec-count{display:inline-flex;align-items:center;gap:3px;border:none;background:none;padding:2px 0;cursor:pointer}
.sec-count em{font-style:normal;color:var(--accent);font-size:13px}
.mrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:9px}
.mrow-t{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;cursor:pointer}
.mrow-t b{display:block;font-size:14px;color:var(--ink)}
.mrow-t span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.mrow-b{display:flex;gap:5px;flex:0 0 auto}
.mrow-b button{height:26px;padding:0 8px;border-radius:7px;border:1px solid #d8e4f0;background:#f7fbff;color:#4b6a86;font-size:12px;cursor:pointer}
.mrow-b button:disabled{opacity:.4}
.mini-add{margin-left:auto;height:27px;padding:0 10px;border-radius:9px;border:1px solid #cfe2f5;background:#f4f9ff;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer}
.resume-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #bfd6f2;box-shadow:0 2px 8px rgba(47,107,176,.08);border-radius:13px;padding:9px 10px 9px 13px;margin:10px 0 2px}
.resume-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:none;padding:0;text-align:left;cursor:pointer}
.resume-t{font-size:13.5px;font-weight:600;color:var(--accent-dark)}
.resume-s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume-x{width:24px;height:24px;border-radius:50%;border:none;background:#eef4fb;color:#7b8fa3;font-size:14px;line-height:1;cursor:pointer;flex:0 0 auto}
.qn-sub{font-size:8.5px;color:#8a9aab;margin-top:1px;letter-spacing:0}
.hl-preview{white-space:pre-wrap;font-size:13.5px;line-height:1.75;color:#3f566b;background:#fbfdff;border:1px dashed #dbe6f1;border-radius:10px;padding:10px 11px;margin-top:8px;max-height:26vh;overflow:auto;-webkit-user-select:text;user-select:text}
.hl-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
.hl-tools .t{font-size:11.5px;color:var(--muted);margin-right:2px}
.hlbtn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11.5px;color:#5b6f80;cursor:pointer}
.hlbtn i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hlbtn.y i{background:#ffe9a6}
.hlbtn.r i{background:#ffd4cf}
.hlbtn.b i{background:#cfe4ff}
.hlbtn.clear{color:var(--muted)}
.undo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px}
.undo-row .muted{flex:1;min-width:120px;line-height:1.5}
.undo-row button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:11.5px;color:#5b6f80}
.issue-panel{background:#fdf8ee;border:1px solid #eddcc0;border-radius:11px;padding:10px 12px;font-size:12.5px;color:#8a6a2b;line-height:1.65;margin-top:12px}
.issue-panel .lbl{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:#a9762a;margin-bottom:5px}
.issue-panel button{background:none;border:0;color:var(--accent-dark);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0}
.qi-note{font-size:11.5px;color:#a9762a;background:#fdf8ee;border-radius:7px;padding:5px 8px;margin-top:7px;line-height:1.5}
.q-hist{font-size:11.5px;color:#8fa3b6;margin:8px 0 2px;letter-spacing:.2px}
.stem-tip{display:flex;align-items:flex-start;gap:4px;font-size:9.5px;line-height:1.5;color:#c0cfdd;margin:6px 0 -2px;transform:scale(.96);transform-origin:left top}
.stem-tip .bd{color:#5b88b5;font-weight:600}
.p-stem{font-family:"Noto Serif SC",serif;font-size:17px;line-height:1.75;font-weight:600;white-space:pre-wrap;word-break:break-word;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.p-stem.marking{-webkit-user-select:text;user-select:text}
.p-stem.marking::selection,.p-stem.marking *::selection{background:rgba(47,111,178,.28)}
.opts{margin-top:18px}
.opt{display:flex;gap:11px;width:100%;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;line-height:1.55;transition:border-color .15s,background .15s}
.opt:active{transform:scale(.996)}
.opt .key{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid #d7e1eb;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted);background:#f8fbfe;margin-top:1px}
.opt .txt{flex:1;white-space:pre-wrap;font-size:14.8px}
.opt:hover{border-color:#c3d6e6}
.opt.sel{border-color:#8fb4da;background:#f2f8ff}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.correct{border-color:#8dc2a9;background:var(--green-soft)}
.opt.correct .key{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:#e2b0ab;background:var(--red-soft)}
.opt.wrong .key{background:var(--red);border-color:var(--red);color:#fff}
.opt.locked{cursor:default}
.multi-hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.fb{margin-top:15px;border-radius:13px;padding:13px 14px;font-size:13.5px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--green-soft);border:1px solid #cfe6d9;color:var(--green);font-weight:500;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.fb.ok .fb-row{margin-top:0}
.fb.bad{background:var(--red-soft);border:1px solid #f1d6d3}
.fb.note{background:#fbf7ec;border:1px solid #eadfc4;color:#8a6a2b}
.fb-title{font-weight:600;color:var(--red);font-size:14px;display:flex;gap:7px;align-items:center}
.fb-row{margin-top:5px;font-size:13px;color:#6b5652}
.fb-row b{color:var(--ink)}
.recite-ans{margin-top:16px;background:#f4f9ff;border:1px solid #cadff2;border-radius:13px;padding:13px 14px;animation:pop .2s ease}
.ra-head{font-size:12.5px;color:var(--accent-dark);font-weight:500;white-space:nowrap}
.ra-head b{font-family:"Noto Serif SC",serif;font-size:17px;color:var(--ink);margin-left:5px}
.ra-short{white-space:pre-wrap;font-size:14px;line-height:1.72;color:#3f566b;margin-top:7px}
.recite-ans .exp{margin-top:9px}
.qn-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin-top:14px}
.qn{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:#93a4b4;font-variant-numeric:tabular-nums;cursor:pointer;padding:0;transition:transform .12s;overflow:hidden}
.qn-n{font-size:12.5px;line-height:1;font-weight:600}
.qn-sub{font-size:8.5px;line-height:1;color:#9aa9b7;letter-spacing:0;white-space:nowrap}
.qn.ok .qn-sub{color:#3d7f63}
.qn.no .qn-sub{color:#b5655d}
.qn:active{transform:scale(.94)}
.qn.ok{background:var(--green-soft);border-color:#9cc9b4;color:#256b52;font-weight:600}
.qn.no{background:var(--red-soft);border-color:#e2b0ab;color:#a3423a;font-weight:600}
.legend{display:flex;gap:14px;align-items:center;margin-top:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line);margin-right:5px;vertical-align:-1px;background:#fff}
.legend i.ok{background:var(--green-soft);border-color:#9cc9b4}
.legend i.no{background:var(--red-soft);border-color:#e2b0ab}
.cover-head{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:4px}
.cover-big{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:600;color:var(--ink)}
.cover-sub{font-size:12px;color:var(--muted);margin-top:4px}
.exp{margin-top:11px;background:#fff;border:1px dashed #e2d7bf;border-radius:10px;padding:10px 12px;font-size:13px;color:#4a4030;white-space:pre-wrap;line-height:1.75}
.exp-label{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--amber);margin-bottom:5px}
.p-foot{display:flex;gap:9px;margin-top:14px;align-items:center}
.p-foot .btn{flex:1}
.skip{color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:9px 3px;flex:none}
.short-box{margin-top:16px;background:#fbfcfe;border:1px solid #e3ecf6;border-radius:12px;padding:12px 14px;font-size:13px;color:#54697c;line-height:1.75;white-space:pre-wrap}
.short-box b{color:var(--ink)}

/* ---------- 结果 ---------- */
.result-head{text-align:center;padding:6px 0 4px}
.score-pct{font-family:"Noto Serif SC",serif;font-size:48px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.score-pct small{font-size:18px;color:var(--muted);margin-left:2px}
.score-sub{color:var(--muted);font-size:13px;margin-top:3px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:"Noto Serif SC",serif;font-size:19px;font-weight:600}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.g b{color:var(--green)}
.stat.r b{color:var(--red)}
.h2-sub{font-size:14.5px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.h2-sub .n{font-size:11.5px;color:var(--muted);font-weight:400}
details.wq{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 14px;margin-bottom:8px}
details.wq summary{cursor:pointer;padding:12px 0;font-size:13.5px;list-style:none;display:flex;gap:8px;align-items:flex-start;line-height:1.6}
details.wq summary::-webkit-details-marker{display:none}
details.wq summary .qn{flex:none;margin-top:2px}
details.wq .wbody{padding:0 0 14px;font-size:12.8px;color:#54677a;line-height:1.7}
details.wq .wbody i{font-style:normal;color:var(--muted);font-size:11.5px}
.result-actions{display:grid;gap:9px;margin-top:20px}

/* ---------- 搜索 ---------- */
.tabs{display:flex;gap:6px;background:#e9eff7;border-radius:12px;padding:3px;margin:14px 0 16px}
.tabs button{flex:1;padding:8px;border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(24,42,58,.1)}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{padding-left:38px}
.search-wrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#a3b4c4}
.sr-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.sr-crumb{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sr-stem{font-size:13.8px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sr-exp{font-size:11.8px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:#dbeafc;color:#1c4c86;padding:0 1px;border-radius:2px}
.log-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 15px;margin-bottom:9px}
.log-card summary{cursor:pointer;padding:13px 0;list-style:none;display:flex;gap:10px;align-items:center}
.log-card summary::-webkit-details-marker{display:none}
.log-card .lc-main{flex:1;min-width:0}
.log-card .lc-title{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-card .lc-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.log-card .lc-score{font-size:11.5px;color:var(--accent);flex:none}
.log-items{padding:0 0 12px;display:grid;gap:7px}
.log-item{display:flex;gap:8px;font-size:12.5px;line-height:1.6;align-items:flex-start;text-align:left;width:100%}
.log-item .ok{color:var(--green);flex:none}
.log-item .no{color:var(--red);flex:none}
.log-item span.t{flex:1;color:#4b6073;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,36,52,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:620px;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1);max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;margin-bottom:5px}
.sheet .row-btns{display:grid;gap:8px;margin-top:4px}
.sheet .row-btns .btn{justify-content:flex-start}
.type-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.type-list .it{display:inline-flex;align-items:center;gap:6px;background:#f4f8fd;border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 11px;font-size:12.5px}
.type-list .it b{font-weight:500}
.type-list .it span{color:#c08b86;cursor:pointer;padding:0 3px}
.sheet .hint{font-size:12.5px;color:var(--muted);margin:0 0 15px;line-height:1.6}
.modal-actions{display:flex;gap:9px;margin-top:18px}
.modal-actions .btn{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:#fff;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.type-chips{display:flex;flex-wrap:wrap;gap:6px}
.type-chips button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);background:#fff;cursor:pointer}
.type-chips button.on{background:var(--soft);border-color:#bcd6f0;color:var(--accent-dark);font-weight:500}
.type-chips button.more{border-style:dashed;color:var(--accent)}
.mini-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-seg button{padding:8px 2px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);cursor:pointer;background:#fff}
.mini-seg button.on{background:var(--soft);border-color:#bcd6f0;color:var(--accent-dark);font-weight:500}
.opt-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt-edit-row .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:11.5px;display:grid;place-items:center}
.opt-edit-row input{flex:1}
.opt-edit-row .del{flex:none;color:#c08b86;font-size:15px;padding:4px;cursor:pointer}
.ans-picker{display:flex;gap:6px;flex-wrap:wrap}
.ans-picker button{min-width:34px;height:34px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--muted)}
.ans-picker button.on{background:var(--green);border-color:var(--green);color:#fff}
.img-grid{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.img-thumb{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-thumb .x{position:absolute;top:0;right:0;width:23px;height:23px;border-radius:0 8px 0 9px;background:rgba(200,55,45,.92);color:#fff;font-size:13px;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.img-add{width:66px;height:66px;border-radius:9px;border:1px dashed #c7d8e8;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;cursor:pointer;background:#fbfdff}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#1d3348;color:#f1f6fb;font-size:13px;padding:9px 17px;border-radius:22px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:80;max-width:86vw;text-align:center;white-space:pre-wrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .hero h1{font-size:34px}
  .course-list{grid-template-columns:1fr 1fr}
  .quick-grid{gap:12px}
  .sheet{border-radius:20px;margin:auto;max-height:86vh}
  .overlay{align-items:center}
}

<input id="restoreFile" type="file" accept=".json,application/json" hidden />

<script src="https://fastly.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script>
/* ================= 基础工具 ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 题干标记：高光 / 下划线 / 圈（可叠加） */
function stemHTML(text, marks) {
  const t = String(text == null ? '' : text);
  const n = t.length;
  if (!marks || !marks.length) return esc(t);
  const ks = new Array(n).fill('');
  marks.forEach(m => {
    const a = Math.max(0, Math.min(Number(m.s) || 0, n));
    const b = Math.max(0, Math.min(Number(m.e) || 0, n));
    const k = m.k === 'ul' ? 'ul' : m.k === 'circle' ? 'circle' : 'hl';
    for (let i = a; i < b; i++) if (ks[i].indexOf(k) < 0) ks[i] = ks[i] ? ks[i] + '-' + k : k;
  });
  let out = '', buf = '', cur = '';
  for (let i = 0; i < n; i++) {
    if (ks[i] !== cur) {
      if (buf) out += cur ? `<span class="mk mk-${cur}">${esc(buf)}</span>` : esc(buf);
      buf = ''; cur = ks[i];
    }
    buf += t[i];
  }
  if (buf) out += cur ? `<span class="mk mk-${cur}">${esc(buf)}</span>` : esc(buf);
  return out;
}

/* 解析高光：把 [{s,e,c}] 套到文本上 */
function expHTML(text, hl) {
  const t = String(text == null ? '' : text);
  if (!hl || !hl.length) return esc(t);
  const n = t.length;
  const isLine = c => c === 'ul' || c === 'wavy' || c === 'circle';
  const bg = new Array(n).fill(''), bgo = new Array(n).fill(-1);
  const ln = new Array(n).fill(''), lno = new Array(n).fill(-1);
  hl.forEach((h, i) => {
    const a = Math.max(0, Math.min(Number(h.s) || 0, n));
    const b = Math.max(0, Math.min(Number(h.e) || 0, n));
    for (let k = a; k < b; k++) {
      if (isLine(h.c)) { ln[k] = h.c; lno[k] = i; }
      else { bg[k] = h.c; bgo[k] = i; }
    }
  });
  let out = '', buf = '', cb = '', cl = '', ob = -1, ol = -1;
  const flush = () => {
    if (!buf) return;
    let inner = esc(buf);
    if (cl) inner = `<span class="hl hl-${cl}" data-act="hlRemove" data-hl="${ol}">${inner}</span>`;
    if (cb) inner = `<span class="hl hl-${cb}" data-act="hlRemove" data-hl="${ob}">${inner}</span>`;
    out += inner; buf = '';
  };
  for (let i = 0; i < n; i++) {
    if (bg[i] !== cb || bgo[i] !== ob || ln[i] !== cl || lno[i] !== ol) { flush(); cb = bg[i]; ob = bgo[i]; cl = ln[i]; ol = lno[i]; }
    buf += t[i];
  }
  flush();
  return out;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const fmtDate = ts => { const d = new Date(ts); return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtTime = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dstr = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const todayStr = () => dstr(Date.now());
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

/* ================= 图片库（IndexedDB） ================= */
const IMG = {};
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('quiz_imgs_v1', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('imgs')) r.result.createObjectStore('imgs'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async init() {
    try { this.db = await this.open(); } catch (e) { this.db = null; }
  },
  async put(id, url) {
    if (!this.db) return;
    await new Promise((res) => {
      try {
        const tx = this.db.transaction('imgs', 'readwrite');
        tx.objectStore('imgs').put(url, id);
        tx.oncomplete = res; tx.onerror = res;
      } catch (e) { res(); }
    });
  },
  async del(id) {
    if (!this.db) return;
    await new Promise((res) => {
      try {
        const tx = this.db.transaction('imgs', 'readwrite');
        tx.objectStore('imgs').delete(id);
        tx.oncomplete = res; tx.onerror = res;
      } catch (e) { res(); }
    });
  },
  async loadAll() {
    if (!this.db) return;
    await new Promise((res) => {
      try {
        const tx = this.db.transaction('imgs', 'readonly');
        const rq = tx.objectStore('imgs').openCursor();
        rq.onsuccess = () => { const cur = rq.result; if (cur) { IMG[cur.key] = cur.value; cur.continue(); } else res(); };
        rq.onerror = res;
      } catch (e) { res(); }
    });
  }
};

async function compressImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const max = 1280;
    let w = bmp.width, h = bmp.height;
    if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', 0.75);
  } catch (e) {
    return await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }
}

/* ================= 解析器 ================= */
/* ==== PARSER START ==== */
function normalizeText(input) {
  return String(input || '')
    .replace(/\r\n?/g, '\n')
    .replace(/^\uFEFF/, '')
    .replace(/[\uFF21-\uFF28\uFF41-\uFF48]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/\u3000/g, ' ');
}

function expandLine(line) {
  let out = line;
  out = out.replace(/([ \t。；;，,？?：:])([A-H])\s*([.、)．])\s*/g, (m, p, l, d) => p + '\n' + l + d + ' ');
  out = out.replace(/([ \t。；;])((?:答案解析|解析|详解|分析))\s*[:：]?\s*/g, (m, p, k) => p + '\n' + k + ':');
  out = out.replace(/([ \t。；;])((?:正确答案|参考答案|答案|答))(?![题案析分])\s*[:：]?\s*/g, (m, p, k) => p + '\n' + k + ':');
  return out.split('\n');
}

function extractAnswer(rest, options) {
  const t = String(rest || '').trim();
  const m = t.match(/^[A-H](?:\s*[、,，\/]?\s*[A-H]){0,3}/i);
  if (m) return m[0].toUpperCase().replace(/[^A-H]/g, '');
  if (/^[√✓对]/.test(t) || /\b正确\b/.test(t)) {
    const o = options.find(x => /正确|对|是|√/.test(x.t));
    if (o) return o.k;
  }
  if (/^[×✗xX]/.test(t) || /错误/.test(t)) {
    const o = options.find(x => /错误|错|否|×/.test(x.t));
    if (o) return o.k;
  }
  const o = options.find(x => x.t && (x.t === t || (t.length > 1 && x.t.indexOf(t) > -1)));
  return o ? o.k : '';
}

function parseQuestions(text) {
  const lines = [];
  normalizeText(text).split('\n').forEach(l => expandLine(l).forEach(seg => lines.push(seg.trim())));

  // 把“A 白蛋白 / B 球蛋白”这种无标点、连续成组的选项补成标准写法
  for (let i = 0; i < lines.length; i++) {
    if (!/^[A-H][ \t]+\S/.test(lines[i])) continue;
    let j = i, buf = [];
    while (j < lines.length && /^[A-H][ \t]+\S/.test(lines[j])) {
      buf.push(lines[j].replace(/^([A-H])[ \t]+/, '$1. '));
      j++;
    }
    if (buf.length >= 2) { lines.splice(i, buf.length, ...buf); i = j - 1; }
  }

  const QUESTIONS = [];
  let cur = null;
  let mode = null;
  let sectionType = '';
  let sectionName = '';

  const reOpt = /^([A-H])\s*[.、)．:：,，]\s*(.*)$/;
  const reAns = /^(?:【|\[)?(?:正确答案|参考答案|答案|答)(?:】|\])?\s*[:：]?\s*(.*)$/;
  const reExp = /^(?:【|\[)?(?:答案解析|解析|详解|分析|解答|参考答案)(?:】|\])?\s*[:：]?\s*(.*)$/;
  const reQ = /^(?:第\s*)?(\d+)\s*(?:题)?\s*[.、)．,：:]\s*(.*)$/;
  const reQ2 = /^[（(]\s*(\d+)\s*[)）]\s*(.*)$/;
  const reQ3 = /^第\s*[一二三四五六七八九十0-9]+\s*题\s*[：:.]?\s*(.*)$/;
  const reHead = /^[一二三四五六七八九十]+\s*[、.．]\s*/;
  const reTypeHead = /^[（(【\[]?\s*(单选题?|多选题?|不定项选择题?|判断(?:题)?|简答(?:题)?|名词解释|论述题?|问答题?)\s*[)）】\]]?\s*$/;

  function mapType(w) {
    return /多选|不定项/.test(w) ? 'multi' : (/判断/.test(w) ? 'judge' : (/简答|名词解释|论述|问答/.test(w) ? 'short' : 'single'));
  }

  function setSection(word) {
    let custom = null;
    try { if (typeof DB !== 'undefined' && DB && DB.types) custom = DB.types.find(t => t && t.name === word); } catch (e) {}
    if (custom) { sectionType = custom.base === 'short' ? 'short' : 'single'; sectionName = custom.name; return; }
    sectionType = mapType(word); sectionName = '';
  }

  function newQ(stem) {
    let st = stem || '';
    const mm = st.match(/^(单选题?|多选题?|不定项选择题?|判断(?:题)?|简答(?:题)?|名词解释|论述题?|问答题?)\s*[:：]\s*(.*)$/);
    if (mm) { sectionType = mapType(mm[1]); st = mm[2].trim(); }
    cur = { q: st, options: [], answer: '', exp: '', answerRaw: '', typeHint: sectionType, name: sectionName };
    QUESTIONS.push(cur);
    mode = 'q';
  }

  for (let raw of lines) {
    let line = raw;
    if (!line) continue;

    let stripped = line.replace(/^[一二三四五六七八九十]+\s*[、.．]\s*/, '').trim();
    const tm = stripped.match(reTypeHead);
    if (tm) {
      setSection(tm[1]);
      continue;
    }
    const tb = line.match(/^[（(【\[]\s*(单选题?|多选题?|不定项选择题?|判断(?:题)?|简答(?:题)?|名词解释|论述题?|问答题?)\s*[)）】\]]\s*[:：]?\s*(.*)$/);
    if (tb) {
      setSection(tb[1]);
      const rest = tb[2].trim();
      if (rest) newQ(rest);
      continue;
    }
    const tp = line.match(/^(单选题?|多选题?|不定项选择题?|判断(?:题)?|简答(?:题)?|名词解释|论述题?|问答题?)\s*[:：]\s*(.*)$/);
    if (tp) {
      setSection(tp[1]);
      const rest = tp[2].trim();
      if (rest) newQ(rest);
      continue;
    }
    if (reHead.test(line) && line.length < 40) continue;

    line = line.replace(/^(?:【|\[)(?:题目|题干|问题)(?:】|\])\s*/, '');
    line = line.replace(/^(?:题目|题干|问题)\s*[:：]\s*/, '');
    const tf = line.match(/^(?:题型|类型)\s*[:：]\s*(单选|多选|判断|简答)(?:题)?\s*$/);
    if (tf) { sectionType = tf[1] === '多选' ? 'multi' : tf[1] === '判断' ? 'judge' : tf[1] === '简答' ? 'short' : 'single'; continue; }

    let m;
    if ((m = line.match(reQ3))) { newQ((m[1] || '').trim()); continue; }
    if ((m = line.match(reOpt))) {
      if (mode === 'exp' && cur && cur.options.length) { cur.exp += (cur.exp ? '\n' : '') + line; continue; }
      if (!cur) newQ('');
      const val = m[2].trim();
      if (!cur.options.some(o => o.k === m[1])) cur.options.push({ k: m[1], t: val });
      mode = 'o';
      continue;
    }
    if ((m = line.match(reAns))) {
      if (mode === 'exp' && cur && (cur.answer || cur.answerRaw)) { cur.exp += (cur.exp ? '\n' : '') + line; continue; }
      if (!cur) newQ('');
      let rest = m[1].trim();
      const ans = extractAnswer(rest, cur.options);
      cur.answer = ans.slice(0, 4);
      cur.answerRaw = ans ? '' : rest;
      mode = 'a';
      const idx = rest.search(/(?:答案解析|解析|详解|分析)\s*[:：]/);
      if (idx > -1) {
        const extra = rest.slice(idx).replace(/^(?:答案解析|解析|详解|分析)\s*[:：]\s*/, '');
        cur.exp = cur.exp ? cur.exp + '\n' + extra : extra;
        mode = 'exp';
      }
      continue;
    }
    if ((m = line.match(reExp))) {
      if (!cur) newQ('');
      const t = m[1].trim();
      if (t) cur.exp = cur.exp ? cur.exp + '\n' + t : t;
      mode = 'exp';
      continue;
    }
    if ((m = line.match(reQ)) || (m = line.match(reQ2))) { newQ((m[2] || '').trim()); continue; }

    if (mode === 'exp' && cur) { cur.exp += (cur.exp ? '\n' : '') + line; continue; }
    if (mode === 'o' && cur && cur.options.length) {
      const last = cur.options[cur.options.length - 1];
      last.t = (last.t ? last.t + ' ' : '') + line;
      continue;
    }
    if (cur && !cur.options.length && !cur.answer && !cur.exp && !cur.answerRaw) {
      cur.q = cur.q ? cur.q + ' ' + line : line;
      mode = 'q';
      continue;
    }
    if (!cur) { newQ(line); continue; }
    cur.exp = cur.exp ? cur.exp + '\n' + line : line;
    mode = 'exp';
  }

  return QUESTIONS.map(q => {
    let type = q.typeHint || '';
    const opts = q.options.filter(o => o.t && o.t.trim() !== '');
    if (!type) {
      if (opts.length === 2 && /正确|错误|对|错/.test(opts[0].t + opts[1].t)) type = 'judge';
      else if (q.answer.length > 1) type = 'multi';
      else if (opts.length >= 2) type = 'single';
      else type = 'short';
    }
    if (type === 'judge') {
      if (opts.length < 2) { opts.length = 0; opts.push({ k: 'A', t: '正确' }, { k: 'B', t: '错误' }); }
      if (!q.answer) {
        const raw = (q.answerRaw || '').trim();
        if (/正确|对|√|✓|是/.test(raw)) q.answer = 'A';
        else if (/错误|错|×|✗|否/.test(raw)) q.answer = 'B';
      }
    }
    let exp = q.exp.trim();
    if (type === 'short' && !exp && q.answerRaw) exp = q.answerRaw;
    return {
      q: (q.q || '').trim(),
      name: q.name || '',
      type,
      options: type === 'short' ? [] : opts,
      answer: type === 'short' ? '' : q.answer.slice(0, type === 'multi' ? 4 : 1),
      exp
    };
  }).filter(q => q.q && (q.type === 'short' || q.options.length >= 2));
}

function parseJSONText(text) {
  let data;
  try { data = JSON.parse(String(text || '').trim()); } catch (e) { return []; }
  const arr = Array.isArray(data) ? data : (data.questions || data.list || data.data || data.items || []);
  if (!Array.isArray(arr)) return [];
  return arr.map(o => {
    if (!o || typeof o !== 'object') return null;
    const q = String(o.q || o.question || o.stem || o.title || o['题目'] || '').trim();
    let raw = o.options || o.opts || o.choices || o['选项'] || [];
    const options = [];
    if (Array.isArray(raw)) {
      raw.forEach((v, i) => {
        const k = String.fromCharCode(65 + i);
        if (typeof v === 'string') options.push({ k, t: v.trim().replace(/^[A-H][.、)．]\s*/, '') });
        else if (v && typeof v === 'object') options.push({ k: String(v.key || v.k || k).toUpperCase(), t: String(v.text || v.t || v.value || '').trim().replace(/^[A-H][.、)．]\s*/, '') });
      });
    } else if (raw && typeof raw === 'object') {
      Object.keys(raw).forEach(k => options.push({ k: String(k).toUpperCase(), t: String(raw[k]).trim() }));
    }
    const answer = String(o.answer || o.correct || o['答案'] || o.key || '').toUpperCase().replace(/[^A-H]/g, '');
    const exp = String(o.exp || o.explanation || o.analysis || o['解析'] || '').trim();
    let type = o.type || '';
    if (!type) type = options.length >= 2 ? (answer.length > 1 ? 'multi' : 'single') : 'short';
    return { q, type, options: type === 'short' ? [] : options.filter(x => x.t), answer: type === 'short' ? '' : answer, exp };
  }).filter(x => x && x.q && (x.type === 'short' || x.options.length >= 2));
}
/* ==== PARSER END ==== */

const DB_KEY = 'quiz_site_v2';
const OLD_KEY = 'quiz_site_v1';
let DB = { v: 2, profile: { major: '', grade: '' }, courses: [], logs: [], types: [] };

function normalizeDB(d) {
  d.v = 2;
  d.profile = d.profile || { major: '', grade: '' };
  d.courses = Array.isArray(d.courses) ? d.courses : [];
  d.logs = Array.isArray(d.logs) ? d.logs : [];
  d.types = Array.isArray(d.types) ? d.types : [];
  d.papers = Array.isArray(d.papers) ? d.papers : [];
  d.courses.forEach(c => {
    c.id = c.id || uid();
    c.major = c.major || '未分类';
    c.grade = c.grade || '未分类';
    c.createdAt = c.createdAt || Date.now();
    c.chapters = Array.isArray(c.chapters) ? c.chapters : [];
    c.chapters.forEach(ch => {
      ch.id = ch.id || uid();
      ch.name = ch.name || '未命名章节';
      ch.folder = ch.folder || '';
      ch.questions = Array.isArray(ch.questions) ? ch.questions : [];
      ch.questions.forEach(q => {
        q.id = q.id || uid();
        q.type = q.type || 'single';
        q.options = Array.isArray(q.options) ? q.options : [];
        q.images = Array.isArray(q.images) ? q.images : [];
        q.st = q.st || { right: 0, wrong: 0, last: 0 };
        q.exp = q.exp || '';
        q.answer = q.answer || '';
        q.name = q.name || '';
        q.fav = !!q.fav;
        q.issue = q.issue || null;
        q.hl = Array.isArray(q.hl) ? q.hl : [];
        q.marks = Array.isArray(q.marks) ? q.marks : [];
      });
    });
  });
  return d;
}

function migrateV1() {
  let old = null;
  try { old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); } catch (e) { old = null; }
  if (!old || !Array.isArray(old.sets) || !old.sets.length) return null;
  const d = { v: 2, profile: { major: '未分类', grade: '未分类' }, courses: [], logs: [] };
  old.sets.forEach(set => {
    const questions = (set.questions || []).map(q => {
      const opts = q.options || [];
      const isJudge = opts.length === 2 && /正确|错误|对|错/.test(opts.map(o => o.t).join(''));
      return {
        id: uid(), type: isJudge ? 'judge' : (q.answer || '').length > 1 ? 'multi' : 'single',
        q: q.q, options: opts, answer: q.answer || '', exp: q.exp || '', images: [], st: { right: 0, wrong: 0, last: 0 }
      };
    });
    d.courses.push({
      id: uid(), major: '未分类', grade: '未分类', name: set.name || '旧题库', createdAt: set.createdAt || Date.now(),
      chapters: [{ id: uid(), name: '全部题目', questions }]
    });
  });
  return d;
}

(function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.courses)) { DB = normalizeDB(d); return; } }
  } catch (e) {}
  const mig = migrateV1();
  if (mig) DB = normalizeDB(mig);
})();

function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch (e) { toast('本地保存失败，存储可能已满'); }
}

/* ================= 查询 ================= */
function getCourse(id) { return DB.courses.find(c => c.id === id) || null; }
function getChapter(cid) { for (const c of DB.courses) { const ch = c.chapters.find(x => x.id === cid); if (ch) return { c, ch }; } return null; }
function findQ(qid) { for (const c of DB.courses) for (const ch of c.chapters) { const q = ch.questions.find(x => x.id === qid); if (q) return { q, c, ch }; } return null; }
function qCount(c) { return c.chapters.reduce((n, ch) => n + ch.questions.length, 0); }
function isObj(q) { return q.type !== 'short'; }
function objCount(c) { return c.chapters.reduce((n, ch) => n + ch.questions.filter(isObj).length, 0); }
function subCount(c) { return qCount(c) - objCount(c); }
function doneCount(c) { return c.chapters.reduce((n, ch) => n + ch.questions.filter(q => q.st.right + q.st.wrong > 0).length, 0); }
function wrongCount(c) { return c.chapters.reduce((n, ch) => n + ch.questions.filter(q => (q.st || {}).wrong > 0).length, 0); }
function doneQCount(c) { return c.chapters.reduce((n, ch) => n + ch.questions.filter(q => ((q.st || {}).wrong || 0) + ((q.st || {}).right || 0) > 0).length, 0); }
function allWrongCount() { return DB.courses.reduce((n, c) => n + wrongCount(c), 0); }
function allDoneCount() { return DB.courses.reduce((n, c) => n + doneQCount(c), 0); }
function allIssueCount() { return DB.courses.reduce((n, c) => n + c.chapters.reduce((m, ch) => m + ch.questions.filter(q => !!q.issue).length, 0), 0); }
function issueLabels(issue) {
  const map = { q: '题目', opt: '选项', ans: '答案', exp: '解析' };
  return ((issue && issue.kinds) || []).map(k => map[k] || k).join('、') || '其他';
}
function allFavCount() { return DB.courses.reduce((n, c) => n + c.chapters.reduce((m, ch) => m + ch.questions.filter(q => q.fav).length, 0), 0); }
function courseAcc(c) {
  let r = 0, w = 0;
  c.chapters.forEach(ch => ch.questions.forEach(q => { r += q.st.right; w += q.st.wrong; }));
  return r + w ? Math.round(r / (r + w) * 100) : 0;
}
function myCourses() { return DB.courses.filter(c => c.major === DB.profile.major && c.grade === DB.profile.grade); }
function typeLabel(t) { return ({ single: '单选题', multi: '多选题', judge: '判断题', short: '简答题' })[t] || '单选题'; }
function typeClass(t) { return ({ single: 't-single', multi: 't-multi', judge: 't-judge', short: 't-short' })[t] || 't-single'; }
function qLabel(q) { return q.name || typeLabel(q.type); }
function qClass(q) { return q.name ? 't-custom' : typeClass(q.type); }
function selectedTypeId(q) {
  if (!q.name) return q.type;
  const t = DB.types.find(x => x.name === q.name);
  return t ? 'c:' + t.id : q.type;
}
function typeChips(q) {
  const sel = selectedTypeId(q);
  const builtins = [['single', '单选'], ['multi', '多选'], ['judge', '判断'], ['short', '简答']];
  return builtins.map(([k, l]) => `<button data-act="setQType" data-t="${k}" class="${sel === k ? 'on' : ''}">${l}</button>`).join('')
    + DB.types.map(t => `<button data-act="setQType" data-t="c:${t.id}" class="${sel === 'c:' + t.id ? 'on' : ''}">${esc(t.name)}</button>`).join('')
    + `<button data-act="newType" class="more">＋ 题型</button>`;
}
function answerText(q) {
  if (q.type === 'short') return '参考答案';
  if (!q.answer) return '未设置';
  if (q.type === 'judge') { const o = (q.options || []).find(x => x.k === q.answer); return o ? o.t : q.answer; }
  return q.answer.split('').join(' ');
}

const GATE_CODES = [
  { code: '200641', name: 'volcano', on: true, admin: true, start: '', end: '' },

];
const ADMIN_PW = '200641';
function gateDayDiff(a, b) {
  if (!a || !b) return 0;
  return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000);
}
function gateStatus(c) {
  if (c && c.admin) return { ok: true, label: '管理员', days: -1, note: '不限' };
  if (!c || c.on === false) return { ok: false, label: '已停用', days: -2, note: '手动停用' };
  const t = todayStr(), st = c.start || '', en = c.end || '';
  if (st && t < st) return { ok: false, label: '未开始', days: gateDayDiff(t, st), note: st + ' 开始' };
  if (en && t > en) return { ok: false, label: '已过期', days: 0, note: en + ' 到期' };
  if (en) return { ok: true, label: '剩 ' + gateDayDiff(t, en) + ' 天', days: gateDayDiff(t, en), note: '到 ' + en };
  return { ok: true, label: '长期', days: 99999, note: '不限' };
}
function gateSysCode(start) {
  const d = (start || todayStr()).replace(/-/g, '').slice(4);
  return d + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}
let GATE = { code: '', name: '', at: 0 };
try { const g = JSON.parse(localStorage.getItem('quiz_gate_v1') || 'null'); if (g && g.code) GATE = g; } catch (e) {}
function gateStore() {
  try { return JSON.parse(localStorage.getItem('quiz_gate_codes_v1') || '[]') || []; } catch (e) { return []; }
}
function gateSetStore(list) { localStorage.setItem('quiz_gate_codes_v1', JSON.stringify(list)); }
function gateAllCodes() {
  const extra = gateStore();
  const base = GATE_CODES.slice();
  extra.forEach(x => {
    const i = base.findIndex(b => b.code.toUpperCase() === x.code.toUpperCase());
    if (i >= 0) base[i] = x; else base.push(x);
  });
  return base;
}
function gateOK(code) {
  const c = gateAllCodes().find(x => x.code.toUpperCase() === String(code || '').trim().toUpperCase());
  if (!c) return null;
  const st = gateStatus(c);
  if (!st.ok) return { __fail: st };
  return c;
}
function gateSave(g) { GATE = g; localStorage.setItem('quiz_gate_v1', JSON.stringify(g)); }

function chapterRow(c, ch, i) {
  const n = ch.questions.length;
  const ob = ch.questions.filter(isObj).length;
  const done = ch.questions.filter(q => q.st.right + q.st.wrong > 0).length;
  return `<button class="chapter-row" data-act="openChapter" data-id="${ch.id}" data-chhold="${ch.id}" data-course="${c.id}">
    <div class="ch-main">
      <div class="ch-name"><span class="num">${pad(i + 1)}</span>${esc(ch.name)}</div>
      <div class="ch-sub">${n} 题 · 客观 ${ob} / 主观 ${n - ob}${done ? ' · 做过 ' + done + ' 题' : ''}</div>
    </div>
    <span class="cr-arrow">›</span>
  </button>`;
}

function folderNames(c) {
  const arr = (c.folders || []).filter(Boolean).slice();
  c.chapters.forEach(ch => { if (ch.folder && arr.indexOf(ch.folder) < 0) arr.push(ch.folder); });
  return arr;
}
function chapterBlocks(c) {
  const names = folderNames(c);
  const noneList = c.chapters.filter(ch => !ch.folder);
  if (!names.length) return noneList.map(ch => chapterRow(c, ch, c.chapters.indexOf(ch))).join('');
  const head = (fo, n) => `<div class="folder-head" data-folderhold="${esc(fo)}" data-course="${c.id}" data-act="folderMenu" data-folder="${esc(fo)}"><span>📁</span><b>${fo ? esc(fo) : '未分组'}</b><span class="n">${n} 章</span></div>`;
  let out = names.map(fo => {
    const list = c.chapters.filter(ch => (ch.folder || '') === fo);
    return head(fo, list.length) + list.map(ch => chapterRow(c, ch, c.chapters.indexOf(ch))).join('');
  }).join('');
  if (noneList.length) out += head('', noneList.length) + noneList.map(ch => chapterRow(c, ch, c.chapters.indexOf(ch))).join('');
  return out;
}

function timerOn() { return DB.profile && DB.profile.timer === 'on'; }
const TM_MIN = 180; /* 3 分钟内关掉＝不算这次计时 */
function tmNow(P) { const t = P && P.tm; if (!t) return 0; return t.acc + (t.since ? (Date.now() - t.since) / 1000 : 0); }
function tmHas(P) { return (P && P.tm && (P.tm.acc > 0 || P.tm.since)) ? true : false; }
function tmToggle() {
  const P = S.practice; if (!P) return;
  P.tm = P.tm || { acc: 0, since: 0 };
  if (P.tm.since) {
    P.tm.acc += (Date.now() - P.tm.since) / 1000;
    P.tm.since = 0;
    if (P.tm.acc < TM_MIN) {
      P.tm.acc = 0;
      toast('不到 3 分钟，这次计时不算');
    } else {
      toast('计时停止，用时 ' + fmtSec(Math.floor(P.tm.acc)));
    }
  } else {
    P.tm.since = Date.now();
    toast('开始计时');
  }
  render();
}
function fmtSec(s) { const m = Math.floor(s / 60), ss = s % 60; return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss; }

function selBarHTML() {
  if (!S.sel || S.modal) return '';
  const n = S.sel.length;
  return `<div class="selbar">

}

function selToggle(id) {
  S.sel = S.sel || [];
  const i = S.sel.indexOf(id);

function qItem(q) {
