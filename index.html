  <textarea id="pasteText" class="input" placeholder="${mode === 'exp' ? '把解析粘贴到这里，比如：&#10;1. 阿托品为 M 胆碱受体阻断药，阻断后 M 样效应消失。&#10;2. 新斯的明抑制胆碱酯酶，使乙酰胆碱堆积。' : '把题目粘贴到这里，比如：&#10;1. 条件致病菌是指…&#10;A. …&#10;B. …&#10;C. …&#10;D. …&#10;答案：C&#10;解析：…'}"></textarea>
  <div style="margin-top:11px"><button class="btn primary block" data-act="${mode === 'exp' ? 'applyExpPaste' : 'parsePaste'}">${mode === 'exp' ? '解析并写入解析' : '解析这段文字'}</button></div>

  ${mode === 'exp' ? `
  <details class="fmt">
    <summary>解析格式说明</summary>
    <div class="fmt-body">
      <div>题号对应这一章里的第几题，只更新提到的题，其他题不动：</div>
<pre>1. 阿托品为 M 胆碱受体阻断药，阻断后出现口干、心率加快。
2. 新斯的明抑制胆碱酯酶，使乙酰胆碱在突触间隙堆积。

（也可以不带题号，改用题干开头定位：）
心室肌细胞动作电位平台期主要由哪种离子流形成？
B。平台期由 L 型钙通道的 Ca2+ 缓慢内流与钾外流共同维持。</pre>
      <div style="margin-top:10px">· 每段以 <b>1.</b> / <b>1、</b> / <b>第1题</b> 开头；解析里可以有换行，直到下一个题号为止。<br>
      · 不写题号时，按空行分段，用段落第一行当题干关键词去匹配题目。<br>
      · 解析写错的，导入后会直接覆盖旧解析。</div>
    </div>
  </details>` : `
  <details class="fmt">
    <summary>格式说明（题目 / 选项 / 答案 / 解析）</summary>
    <div class="fmt-body">
      <div>四种题型都认，写法如下：</div>
<pre>1. 心室肌细胞动作电位平台期主要由哪种离子流形成？
A. Na+ 内流
B. Ca2+ 缓慢内流与 K+ 外流
C. Cl- 外流
D. K+ 快速内流
答案：B
解析：平台期由 L 型钙通道的 Ca2+ 缓慢内流与钾外流共同维持……

2. 肝素通过增强抗凝血酶Ⅲ的活性发挥抗凝作用。
A. 正确
B. 错误
答案：A
解析：肝素与抗凝血酶Ⅲ结合，使其活性显著增强。

3. 简述肝素的抗凝机制。
答案：肝素与抗凝血酶Ⅲ结合，使其构象改变、活性增强，加速灭活凝血酶及 Xa 等因子。</pre>
      <div style="margin-top:10px">· 题号：<b>1.</b> / <b>1、</b> / <b>（1）</b> / <b>第1题</b>；小标题“一、单选题”会自动把后面几题设成该题型。<br>
      · 多选答案写成 <b>答案：ABD</b>；判断题写 <b>答案：正确</b> 或 <b>√</b> 都行。<br>
      · 解析可以先不写，之后用“导入解析”单独补，或逐题改。<br>
      · Word（.docx）直接传，会先抽文字再解析；PDF 请复制文字粘贴。</div>
      <div style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn small" data-act="downloadTemplate">下载模板 txt</button>
        <button class="btn small" data-act="fillTemplate">填入示例文字</button>
      </div>
    </div>
  </details>`}
  `;
}

function ensureImp() {
  if (!S.imp) S.imp = { major: DB.profile.major, grade: DB.profile.grade };
  return S.imp;
}

function readImpForm() {
  const imp = ensureImp();
  const gm = $('#impMajor'); if (gm) imp.major = gm.value.trim() || DB.profile.major;
  const gg = $('#impGrade'); if (gg) imp.grade = gg.value;
  const gc = $('#impCourse'); if (gc) imp.course = gc.value.trim();
  const gh = $('#impChapter'); if (gh) imp.chapter = gh.value.trim();
  const gt = $('#impType'); if (gt) imp.type = gt.value;
  return imp;
}

function placeOf(imp) {
  return {
    major: imp.major || '未分类',
    grade: imp.grade || '未分类',
    course: (imp.course || '').trim() || '未命名科目',
    chapter: (imp.chapter || '').trim() || '未分章节'
  };
}

/* ---------- 预览 ---------- */
function viewPreview() {
  const pv = S.preview;
  if (!pv) return viewImport();
  const qs = pv.questions;
  const ob = qs.filter(q => q.type !== 'short').length;
  const missAns = qs.filter(q => q.type !== 'short' && !q.answer).length;
  const missExp = qs.filter(q => !q.exp).length;
  const place = pv.place;
  return `
  <div class="topbar">
    <button class="icon-btn" data-act="backImport">←</button>
    <h2>确认题目</h2>
  </div>
  <div class="place-card">放进口：<b>${esc(place.major)} · ${esc(place.grade)}</b> / <b>${esc(place.course)}</b> / <b>${esc(place.chapter)}</b></div>
  <div class="summary">
    <span class="chip gray">共 ${qs.length} 题</span>
    <span class="chip">客观 ${ob}</span>
    <span class="chip">主观 ${qs.length - ob}</span>
    ${missAns ? `<span class="chip warn">${missAns} 题没答案</span>` : ''}
    ${missExp ? `<span class="chip warn">${missExp} 题无解析</span>` : ''}
  </div>

  ${qs.map((q, i) => previewCard(q, i)).join('')}

  <div class="sticky-foot">
    <button class="btn primary block" data-act="savePreview">保存 ${qs.length} 道题，开始练习</button>
  </div>
  `;
}

function previewCard(q, i) {
  return `<div class="qcard">
    <div class="qc-head">
      <span class="num">${pad(i + 1)}</span>
      <span class="tag ${qClass(q)}">${qLabel(q)}</span>
      ${q.answer ? `<span class="tag ghost">${esc(answerText(q))}</span>` : ''}
    </div>
    <div class="qc-stem">${esc(q.q)}</div>
    ${q.images && (q.images||[]).length ? `<div class="qc-imgs">${(q.images||[]).map(id => IMG[id] ? `<img src="${IMG[id]}" alt="">` : '').join('')}</div>` : ''}
    ${q.options.length ? `<ul class="qc-opts">${q.options.map(o => `<li class="${q.answer.indexOf(o.k) > -1 ? 'ans' : ''}"><b>${o.k}</b>${esc(o.t)}</li>`).join('')}</ul>` : ''}
    ${q.exp ? `<div class="exp" style="margin-top:9px"><span class="exp-label">${q.type === 'short' ? '参考答案' : '解析'}</span>${expHTML(q.exp, q.hl)}</div>` : ''}
    <div class="qc-foot">
      <button data-act="editPreviewQ" data-idx="${i}">编辑</button>
      <button data-act="addPreviewImg" data-idx="${i}">加图片</button>
      <button data-act="delPreviewQ" data-idx="${i}">删除</button>
    </div>
  </div>`;
}

/* ---------- 练习 ---------- */
function viewPractice() {
  const P = S.practice;
  if (!P || !P.list.length) return viewHome();
  const q = P.list[P.idx];
  const total = P.list.length;
  const pct = total ? (P.idx / total) * 100 : 0;
  return `
  <div class="p-top">
    <button class="icon-btn" data-act="exitPractice">←</button>
    <div class="p-tt"><div class="p-title">${esc(P.title)}</div></div>
    <span class="p-flex"></span>
    <div class="p-by">by 来一块小饼干</div>
    ${(() => {
      const secs = Math.floor(tmNow(P));
      const run = !!(P.tm && P.tm.since);
      const txt = tmHas(P) ? fmtSec(secs) : '⏱ 开始计时';
      const cls = !tmHas(P) ? ' idle' : run ? ' run' : ' has';
      return `<button class="p-timer${cls}" id="pTimer" data-act="tmToggle">${txt}</button>`;
    })()}
    ${total >= 10 ? `<button class="p-count jump" data-act="openPalette" title="题号导航"><b>${P.idx + 1}</b>/${total}</button>` : `<div class="p-count"><b>${P.idx + 1}</b>/${total}</div>`}
  </div>
  <div class="bar"><i style="width:${clamp(pct, 3, 100)}%"></i></div>

  <div class="q-main">
    <div class="q-type-row">
      <span class="tag ${qClass(q)}">${qLabel(q)}</span>
      ${q.type === 'multi' ? '<span class="tag ghost">可以多选</span>' : ''}
      <span class="idx">第 ${P.idx + 1} 题</span>
      <button class="ask ${S.draftQ === q.id ? 'on' : ''}" data-act="draftToggle" data-qid="${q.id}" title="草稿（在题上写字）">✎</button>
      <button class="ask ${q.fav ? 'on' : ''}" data-act="favQ" data-qid="${q.id}" title="${q.fav ? '取消收藏' : '收藏这道题'}">${q.fav ? '★' : '☆'}</button>
      <button class="ask" data-act="askQ" data-qid="${q.id}" title="这道题有问题？点这里反馈">?</button>
    </div>
    ${(q.st.right || 0) + (q.st.wrong || 0) ? `<div class="q-hist">本题做过 ${(q.st.right || 0) + (q.st.wrong || 0)} 次 · 对 ${q.st.right || 0} · 错 ${q.st.wrong || 0} · 正确率 ${Math.round((q.st.right || 0) / ((q.st.right || 0) + (q.st.wrong || 0)) * 100)}%</div>` : ''}
    <div class="stem-tip"><span><b class="bd">长按题干</b>可标重点 · 拖选文字后点样式</span></div>
    <div class="p-stem" data-stemq="${q.id}">${stemHTML(q.q, q.marks)}</div>
    ${(q.images||[]).length ? `<div class="q-imgs">${(q.images||[]).map(id => IMG[id] ? `<img src="${IMG[id]}" alt="">` : '').join('')}</div>` : ''}
    ${renderAnswerArea(q, P)}
    ${renderFeedback(q, P)}
    ${(() => {
      const rec = (P.answers || []).filter(a => a.qi === P.idx).pop();
      if (!rec || typeof rec.correct !== 'boolean') return '';
      if (q.type !== 'short' && !q.answer) return '';
      return `<div class="regrade"><span>这题算${rec.correct ? '做对' : '做错'}</span><button data-act="regrade">${rec.correct ? '我是蒙的，改判为错' : '其实我会，改判为对'}</button></div>`;
    })()}
    ${S.draftQ === q.id ? `<div class="draft-layer" data-draft="${q.id}"><div class="draft-bar"><span>草稿 · 直接用手指写</span><button data-act="draftClear">清除</button><button class="primary" data-act="draftClose">完成</button></div><canvas id="draftCv"></canvas></div>` : ''}
  </div>
  ${practiceFoot(q, P)}
  `;
}

function renderAnswerArea(q, P) {
  if (q.type === 'short') {
    if (!P.revealed) {
      return `<div class="opts"><div class="short-box">简答题不设选项，先在心里组织答案，再对照参考答案自评。</div>
        <div style="margin-top:10px"><button class="btn block" data-act="reveal">显示参考答案</button></div></div>`;
    }
    return `<div class="opts"><div class="short-box"><div class="exp-head"><b>参考答案</b><button class="exp-edit" data-act="editExp" data-qid="${q.id}">改答案 / 标重点</button></div>${q.exp ? expHTML(q.exp, q.hl) : '这道题还没有参考答案。'}</div></div>`;
  }
  const multi = q.type === 'multi';
  const untouched = !P.picked && !P.submitted;
  return `<div class="opts">
    ${q.options.map(o => optBtn(o, q, P)).join('')}
    ${multi && untouched ? '<div class="multi-hint">选好后点下面的“提交答案”。</div>' : ''}
    ${untouched && q.answer ? '<button class="idk" data-act="idk">直接看答案</button>' : ''}
  </div>`;
}

function optBtn(o, q, P) {
  let cls = 'opt';
  const answered = P.picked !== null || P.submitted;
  const ex = P.excl && P.excl[o.k];
  if (ex) cls += ' excl';
  if (!answered && q.type === 'multi' && P.multiSel.indexOf(o.k) > -1) cls += ' sel';
  if (answered) {
    if (q.answer.indexOf(o.k) > -1) cls += ' correct';
    const mine = (P.picked && P.picked.indexOf(o.k) > -1);
    if (mine && q.answer.indexOf(o.k) === -1) cls += ' wrong';
    cls += ' locked';
  }
  return `<button class="${cls}" data-act="pick" data-k="${o.k}">
    <span class="key">${o.k}</span><span class="txt">${esc(o.t)}</span>
  </button>`;
}

function renderFeedback(q, P) {
  if (q.type === 'short') {
    if (!P.revealed) return '';
    if (P.judged === null) {
      return `<div class="fb note">对照参考答案，给自己判一下。</div>
        <div class="p-foot"><button class="btn small" data-act="self" data-ok="0">没答上来</button><button class="btn small primary" data-act="self" data-ok="1">答得差不多</button></div>`;
    }
    return '';
  }
  const expHead = `<div class="exp-head"><span class="exp-label">解析</span><button class="exp-edit" data-act="editExp" data-qid="${q.id}">改解析 / 标重点</button></div>`;
  if (!q.answer) return `<div class="fb note">这道题还没有设置答案，看完解析继续。</div>${q.exp ? `<div class="exp">${expHead}${expHTML(q.exp, q.hl)}</div>` : `<div class="exp">${expHead}这道题还没有解析。</div>`}`;
  if (P.picked === null && !P.submitted) {
    if (!P.revealed) return '';
    return `<div class="fb note">正确答案 <b>${esc(answerText(q))}</b> · 看完自己选，或者跳过这题</div>${q.exp ? `<div class="exp">${expHead}${expHTML(q.exp, q.hl)}</div>` : ''}`;
  }
  const hit = P.picked && String(P.picked).split('').sort().join('') === String(q.answer).split('').sort().join('');
  if (P.correct === true) {
    const wc = q.st.wrong || 0;
    const wp = [...new Set(((q.st.picks) || []).filter(x => x.ok === false && x.k).map(x => x.k))];
    const hist = wc ? `<div class="hist-line"><span>此前错 <b>${wc}</b> 次</span>${wp.length ? `<span class="hi">·</span><span>曾选 <b>${esc(wp.join('、'))}</b></span>` : ''}</div>` : '';
    return `<div class="fb ok">✓ ${hit ? '回答正确' : '按你的改判算对'}<div class="fb-row">你选了 <b>${esc(P.picked || '')}</b></div></div>${hist}${q.exp ? `<div class="exp">${expHead}${expHTML(q.exp, q.hl)}</div>` : ''}`;
  }
  const wc2 = q.st.wrong || 0;
  const wp2 = [...new Set(((q.st.picks) || []).filter(x => x.ok === false && x.k && x.k !== P.picked).map(x => x.k))];
  const hist2 = wc2 ? `<div class="hist-line"><span>此前错 <b>${wc2}</b> 次</span>${wp2.length ? `<span class="hi">·</span><span>曾选 <b>${esc(wp2.join('、'))}</b></span>` : ''}</div>` : '';
  return `<div class="fb bad">
    <div class="fb-title">✕ ${!P.picked ? '这题不会' : hit ? '按你的改判算错' : '回答错误'}</div>
    <div class="fb-row">正确答案 <b>${esc(answerText(q))}</b>${P.picked ? ` · 你选了 <b>${esc(P.picked)}</b>` : ' · 你没选'}</div>
    ${hist2}
    <div class="exp">${expHead}${q.exp ? expHTML(q.exp, q.hl) : '这道题还没有解析。'}</div>
  </div>`;
}

function practiceFoot(q, P) {
  const total = P.list.length;
  const isLast = P.idx + 1 === total;
  const prev = `<button class="btn small" data-act="prevQ" ${P.idx === 0 ? 'disabled' : ''}>‹ 上一题</button>`;
  if (q.type === 'short') {
    if (!P.revealed) return `<div class="p-foot">${prev}<button class="skip" data-act="next">跳过这题 ›</button></div>`;
    if (P.judged === null) return '';
    return `<div class="p-foot">${prev}<button class="btn primary" data-act="next">${isLast ? '看结果' : '下一题'} →</button></div>`;
  }
  if (q.type === 'multi' && !P.submitted && !P.picked) {
    return `<div class="p-foot">${prev}<button class="skip" data-act="next">跳过</button><button class="btn primary" data-act="submitMulti">提交答案</button></div>`;
  }
  if (P.picked === null) return `<div class="p-foot">${prev}<button class="skip" data-act="next">跳过这题 ›</button></div>`;
  if (P.correct === true) return `<div class="p-foot">${prev}<button class="btn primary" data-act="next">${isLast ? '看结果' : '下一题'} →</button></div>`;
  return `<div class="p-foot">${prev}<button class="btn primary" data-act="next">${isLast ? '看结果' : '下一题'} →</button></div>`;
}

/* ---------- 结果 ---------- */
function viewResult() {
  const P = S.practice, R = S.result;
  const total = P ? P.list.length : 0;
  const right = R ? R.right : 0;
  const wrong = R ? R.wrong : 0;
  const blank = total - right - wrong;
  const pct = total ? Math.round(right / total * 100) : 0;
  const wrongItems = R ? R.wrongItems : [];
  const hitHist = P ? P.list.map((q, i) => ({ q, i, a: (P.answers || []).filter(x => x.qi === i).pop() }))
    .filter(x => x.a && x.a.correct === true && ((x.q.st || {}).wrong || 0) > 0) : [];
  return `
  <div class="topbar">
    <button class="icon-btn" data-act="exitResult">←</button>
    <h2>练习结果</h2>
    <span class="muted" style="font-size:11.5px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(P ? P.title : '')}</span>
  </div>
  <div class="result-head">
    <div class="score-pct">${pct}<small>%</small></div>
    <div class="score-sub">共 ${total} 题，答对 ${right} 题${P && tmHas(P) && Math.floor(tmNow(P)) >= TM_MIN ? ' · 用时 ' + fmtSec(Math.floor(tmNow(P))) : ''}</div>
  </div>
  <div class="stat-row">
    <div class="stat g"><b>${right}</b><span>答对</span></div>
    <div class="stat r"><b>${wrong}</b><span>答错</span></div>
    <div class="stat"><b>${blank}</b><span>没做</span></div>
  </div>

  ${wrongItems.length ? `<div class="h2-sub">错题回顾 <span class="n">${wrongItems.length} 题</span></div>
  ${wrongItems.map((it, i) => {
    const q = it.q;
    return `<details class="wq" open>
      <summary><span class="tag ${qClass(q)} qn">${qLabel(q)}</span><span>${esc(q.q)}</span></summary>
      <div class="wbody">
        ${q.type !== 'short' ? q.options.map(o => `<div>${q.answer.indexOf(o.k) > -1 ? '✔' : ((it.picked || '').indexOf(o.k) > -1 ? '✘' : '·')} ${o.k}. ${esc(o.t)}</div>`).join('') : ''}
        <div style="margin-top:7px"><i>你答：${esc(it.picked || '未答')} ｜ 正确：${esc(answerText(q))}</i></div>
        ${(() => { const wc = q.st.wrong || 0; const wp = [...new Set(((q.st.picks) || []).filter(x => x.ok === false && x.k && x.k !== it.picked).map(x => x.k))]; return wc ? `<div class="hist-line"><span>错过 <b>${wc}</b> 次</span>${wp.length ? `<span class="hi">·</span><span>曾选 <b>${esc(wp.join('、'))}</b></span>` : ''}</div>` : ''; })()}
        ${q.exp ? `<div class="exp" style="margin-top:8px"><span class="exp-label">${q.type === 'short' ? '参考答案' : '解析'}</span>${expHTML(q.exp, q.hl)}</div>` : ''}
      </div>
    </details>`;
  }).join('')}` : `<div class="empty" style="padding:24px 0"><h3>全对，漂亮。</h3><p>这次没有错题。</p></div>`}

  ${(R && R.histRight && R.histRight.length) ? `<div class="h2-sub">本次答对 · 但曾错过 <span class="n">${R.histRight.length} 题</span></div>
  ${R.histRight.map(it => {
    const q = it.q, wc = q.st.wrong || 0;
    const wp = [...new Set(((q.st.picks) || []).filter(x => x.ok === false && x.k).map(x => x.k))];
    return `<details class="wq" open>
      <summary><span class="tag ${qClass(q)} qn">${qLabel(q)}</span><span>${esc(q.q)}</span></summary>
      <div class="wbody">
        <div style="margin-top:4px"><i>本次你选：${esc(it.picked || '')} · 正确</i></div>
        <div class="hist-line"><span>曾错 <b>${wc}</b> 次</span>${wp.length ? `<span class="hi">·</span><span>曾选 <b>${esc(wp.join('、'))}</b></span>` : ''}</div>
        ${q.exp ? `<div class="exp" style="margin-top:8px"><span class="exp-label">解析</span>${expHTML(q.exp, q.hl)}</div>` : ''}
      </div>
    </details>`;
  }).join('')}` : ''}

  ${hitHist.length ? `<div class="h2-sub">本次答对 · 曾错过 <span class="n">${hitHist.length} 题</span></div>
  ${hitHist.map(x => {
    const q = x.q; const st = q.st || {}; const wc = st.wrong || 0;
    const wp = [...new Set(((st.picks) || []).filter(o => o.ok === false && o.k).map(o => o.k))];
    return `<details class="wq" open>

  <div class="result-actions">
    <button class="btn primary" data-act="restart">再练一遍</button>

    <button class="btn" data-act="exitResult">${P && P.chapterId ? '返回章节' : '返回首页'}</button>
  </div>
  `;
}

/* ---------- 错题本 / 做过的题 ---------- */
function bookList() {
  const tab = S.bookTab || 'wrong';
  const cid = S.bookCourse || '';
  const items = [];
  DB.courses.forEach(c => {
    if (cid && c.id !== cid) return;
    c.chapters.forEach(ch => ch.questions.forEach(q => {
      const st = q.st || {};
      const r = st.right || 0, w = st.wrong || 0;
      const keep = tab === 'wrong' ? w > 0 : tab === 'right' ? r > 0 : tab === 'fav' ? !!q.fav : tab === 'issue' ? !!q.issue : (r + w) > 0;
      if (keep) items.push({ q, c, ch });
    }));
  });
  items.sort((a, b) => ((b.q.st || {}).wrong || 0) - ((a.q.st || {}).wrong || 0));
  return items;
}

function viewSearch() {

    <button class="${S.searchTab === 'date' ? 'on' : ''}" data-act="searchTab" data-t="date">按日期找</button>
  </div>
  ${S.searchTab === 'kw'
    ? `<div class="search-wrap"><input class="input" id="kw" placeholder="搜题干、选项、解析里的词…" value="${esc(S.keyword)}" /><span class="si">${ICON.search}</span></div>`
    : `<div class="field"><input class="input" type="date" id="datePick" value="${esc(S.date)}" /></div>`}
  <div id="searchResults">${searchResultsHTML()}</div>
  `;

function searchResultsHTML() {
  if (S.searchTab === 'date') return dateResults();
  const kw = (S.keyword || '').trim();
  if (!kw) return `<div class="empty" style="padding:36px 10px"><p>输入一个词，比如“肝素”“平台期”</p></div>`;
  const low = kw.toLowerCase();
  const hits = [];
  DB.courses.forEach(c => c.chapters.forEach(ch => ch.questions.forEach(q => {
    const hay = (q.q + ' ' + q.options.map(o => o.t).join(' ') + ' ' + q.exp).toLowerCase();
    if (hay.indexOf(low) > -1) hits.push({ q, c, ch });
  })));
  if (!hits.length) return `<div class="empty" style="padding:36px 10px"><p>没有找到含“${esc(kw)}”的题</p></div>`;
  return `<div class="crumb" style="margin-bottom:10px">共 ${hits.length} 道相关题目</div>
  ${hits.slice(0, 60).map(h => {
    const inExp = h.q.exp.toLowerCase().indexOf(low) > -1 && h.q.q.toLowerCase().indexOf(low) === -1;
    return `<button class="sr-item" data-act="openQ" data-qid="${h.q.id}">
      <div class="sr-crumb"><span class="tag ${qClass(h.q)}">${qLabel(h.q)}</span><span>${esc(h.c.name)}</span><span>›</span><span>${esc(h.ch.name)}</span></div>
      <div class="sr-stem">${hl(h.q.q, kw)}</div>
      ${inExp ? `<div class="sr-exp">解析：${hl(h.q.exp, kw)}</div>` : ''}
    </button>`;
  }).join('')}`;
}

function dateResults() {
  const logs = DB.logs.filter(l => dstr(l.at) === S.date);
  if (!logs.length) return `<div class="empty" style="padding:36px 10px"><p>${esc(S.date)} 这天还没有练习记录</p></div>`;
  const total = logs.reduce((n, l) => n + l.items.length, 0);
  return `<div class="crumb" style="margin-bottom:10px">${esc(S.date)} · ${logs.length} 次练习 · ${total} 道题</div>
  ${logs.map(l => {
    const r = l.items.filter(i => i.correct === true).length;
    const w = l.items.filter(i => i.correct === false).length;
    return `<div class="log-card">
      <details>
        <summary>
          <div class="lc-main">
            <div class="lc-title">${esc(l.title || l.chapterName || '练习')}</div>
            <div class="lc-sub">${fmtTime(l.at)} · ${esc(l.courseName || '')}${l.chapterName ? ' · ' + esc(l.chapterName) : ''}</div>
          </div>
          <div class="lc-score">${r} 对 / ${w} 错</div>
        </summary>
        <div class="log-items">
          ${l.items.map(it => {
            const f = findQ(it.qid);
            return `<button class="log-item" ${f ? `data-act="openQ" data-qid="${it.qid}"` : 'disabled'}>
              <span class="${it.correct === true ? 'ok' : it.correct === false ? 'no' : ''}">${it.correct === true ? '✓' : it.correct === false ? '✕' : '·'}</span>
              <span class="t">${esc(it.stem || '(题目已删除)')}</span>
            </button>`;
          }).join('')}
        </div>
      </details>
    </div>`;
  }).join('')}`;
}

function hl(text, kw) {
  const t = String(text || '');
  if (!kw) return esc(t);
  const low = t.toLowerCase(), k = kw.toLowerCase();
  let out = '', i = 0;
  while (true) {
    const j = low.indexOf(k, i);
    if (j < 0) { out += esc(t.slice(i)); break; }
    out += esc(t.slice(i, j)) + '<mark>' + esc(t.slice(j, j + kw.length)) + '</mark>';
    i = j + kw.length;
  }
  return out;
}

/* ================= 图片 ================= */
let imgBusy = false;
async function handleImages(files, target) {
  if (!target || !files || !files.length) return;
  if (imgBusy) { toast('正在处理上一张图片'); return; }
  imgBusy = true;
  try {
    for (const f of Array.from(files)) {
      const url = await compressImage(f);
      const id = uid();
      IMG[id] = url;
      await IDB.put(id, url);
      if (!target.images) target.images = [];
      target.images.push(id);
    }
    saveDB();
    render();
    toast('图片已添加');
  } catch (e) { toast('图片处理失败'); }
  imgBusy = false;
}

/* ================= 练习逻辑 ================= */
function practiceList(courseId, chapterId) {
  let arr = [];
  if (chapterId) {
    const f = getChapter(chapterId);
    if (f) arr = f.ch.questions.slice();
  } else if (courseId) {
    const c = getCourse(courseId);
    if (c) c.chapters.forEach(ch => arr.push(...ch.questions));
  }
  return arr;
}

function scopeCounts(arr) {
  return {
    all: arr.length,
    obj: arr.filter(q => q.type !== 'short').length,
    sub: arr.filter(q => q.type === 'short').length,
    wrong: arr.filter(q => q.st.wrong > 0).length
  };
}

const SESS_KEY = 'quiz_session_v1';
function saveSession() {
  const P = S.practice;
  if (!P) return;
  try {
    localStorage.setItem(SESS_KEY, JSON.stringify({
      ids: P.list.map(q => q.id), idx: P.idx, title: P.title, courseId: P.courseId,
      chapterId: P.chapterId, mode: P.mode, answers: P.answers, savedAt: Date.now()
    }));
  } catch (e) {}
}
async function idbAll() {
  const out = {};
  if (!IDB.db) return out;
  await new Promise((res) => {
    try {
      const tx = IDB.db.transaction('imgs', 'readonly');
      const rq = tx.objectStore('imgs').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } else res(); };
      rq.onerror = res;
    } catch (e) { res(); }
  });
  return out;
}

async function exportAllData() {

async function restoreAllData(file, el) {

function loadSession() {
  try {
    const d = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
    if (!d || !Array.isArray(d.ids) || !d.ids.length) return null;
    const list = d.ids.map(id => { const f = findQ(id); return f ? f.q : null; }).filter(Boolean).map(q => {
      q.images = Array.isArray(q.images) ? q.images : [];
      q.options = Array.isArray(q.options) ? q.options : [];
      q.marks = Array.isArray(q.marks) ? q.marks : [];
      q.st = q.st || { right: 0, wrong: 0, last: 0 };
      return q;
    });
    if (!list.length) return null;
    return { ...d, list };
  } catch (e) { return null; }
}
function clearSession() { try { localStorage.removeItem(SESS_KEY); } catch (e) {} }

function startPractice(list, opts) {
  if (opts.random) {
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  }
  S.practice = {
    list, idx: Math.max(0, Math.min(opts.startIdx || 0, list.length - 1)), answers: [], picked: null, multiSel: [], submitted: false,
    revealed: false, judged: null, correct: null,
    title: opts.title, courseId: opts.courseId || null, chapterId: opts.chapterId || null, mode: opts.mode || 'all',
    tm: { acc: 0, since: opts.timer ? Date.now() : 0 }
  };
  S.view = 'practice';
  render();
}

function curQ() { return S.practice ? S.practice.list[S.practice.idx] : null; }

/* 回到做过的题：把当时选的答案、解析、统计都还原 */
function resetPState(P) {
  P.picked = null; P.multiSel = []; P.submitted = false; P.revealed = false; P.judged = null; P.correct = null; P.excl = {};
}
function loadAnswerState(P) {
  resetPState(P);
  if (!P) return;
  const rec = (P.answers || []).filter(a => a.qi === P.idx).pop();
  if (!rec) return;
  const q = P.list[P.idx];
  if (!q) return;
  if (q.type === 'short') {
    if (rec.picked === '自评') { P.judged = rec.correct; P.correct = rec.correct; }
    P.revealed = true;
    return;
  }
  if (q.type === 'multi') { P.picked = rec.picked; P.multiSel = String(rec.picked || '').split('').filter(Boolean); P.submitted = true; }
  else { P.picked = rec.picked; }
  P.correct = rec.correct;
  P.revealed = true;
}

function recordAnswer(correct, picked) {
  const P = S.practice, q = curQ();
  P.answers.push({ qi: P.idx, qid: q.id, correct, picked: picked || '' });
  if (correct === true) q.st.right++;
  else if (correct === false) q.st.wrong++;
  q.st.picked = picked || '';
  const _pk = Array.isArray(q.st.picks) ? q.st.picks : [];
  _pk.push({ k: picked || '', ok: correct === true });
  q.st.picks = _pk.slice(-8);
  q.st.last = Date.now();
  saveDB();
  saveSession();
}

function pick(k) {
  const P = S.practice, q = curQ();
  if (!P || P.picked !== null || P.submitted) return;
  if (P.excl && P.excl[k]) { toast('这个选项被你排除了，长按选项可恢复'); return; }
  if (!q) return;
  if (q.type === 'multi') {
    const i = P.multiSel.indexOf(k);
    if (i > -1) P.multiSel.splice(i, 1); else P.multiSel.push(k);
    render();
    return;
  }
  if (!q.answer) { P.picked = k; render(); return; }
  P.picked = k;
  const correct = k === q.answer;
  P.correct = correct;
  recordAnswer(correct, k);
  render();
  if (correct) S.timer = setTimeout(advance, 700);
}

function submitMulti() {
  const P = S.practice, q = curQ();
  if (!q || P.submitted) return;
  if (!P.multiSel.length) { toast('先选至少一个选项'); return; }
  P.submitted = true;
  const sel = P.multiSel.slice().sort().join('');
  if (!q.answer) { P.picked = sel; render(); return; }
  const correct = sel === q.answer.split('').sort().join('');
  P.picked = sel;
  P.correct = correct;
  recordAnswer(correct, sel);
  render();
  if (correct) S.timer = setTimeout(advance, 700);
}

function reveal() {
  const P = S.practice;
  if (!P) return;
  P.revealed = true;
  render();
}

function selfJudge(ok) {
  const P = S.practice;
  if (!P || P.judged !== null) return;
  P.judged = !!ok;
  P.correct = !!ok;
  recordAnswer(!!ok, '自评');
  render();
}

function idk() {
  const P = S.practice, q = curQ();
  if (!P || !q) return;
  if (P.picked || P.submitted) return;
  P.revealed = true;
  render();
  toast('答案在下面，看完自己想选就选');
}

function regrade() {
  const P = S.practice, q = curQ();
  if (!P || !q) return;
  const rec = (P.answers || []).filter(a => a.qi === P.idx).pop();
  if (!rec || typeof rec.correct !== 'boolean') { toast('这题还没有判定，改不了'); return; }
  const to = !rec.correct;
  if (rec.correct && (q.st.right || 0) > 0) q.st.right--;
  if (!rec.correct && (q.st.wrong || 0) > 0) q.st.wrong--;
  if (to) q.st.right = (q.st.right || 0) + 1; else q.st.wrong = (q.st.wrong || 0) + 1;
  rec.correct = to;
  P.correct = to;
  if (q.type === 'short') P.judged = to;
  if (S.result) {
    const answers = P.answers || [];
    S.result.right = answers.filter(a => a.correct === true).length;
    S.result.wrong = answers.filter(a => a.correct === false).length;
    S.result.wrongItems = answers.filter(a => a.correct === false).map(a => ({ q: P.list[a.qi], picked: a.picked }));
    const log = (DB.logs || [])[0];
    if (log && log.items) { const it = log.items.find(x => x.qid === rec.qid); if (it) it.correct = to; }
  }
  saveDB(); saveSession(); render();
  toast(to ? '改判为做对' : '改判为做错，这题算错一次');
}

function advance() {
  clearTimeout(S.timer);
  const P = S.practice;
  if (!P) return;
  if (P.idx + 1 >= P.list.length) finish();
  else {
    P.idx++;
    loadAnswerState(P);
    saveSession();
    render();
  }
}

function finish() {
  const P = S.practice;
  const answers = P.answers;
  const right = answers.filter(a => a.correct === true).length;
  const wrong = answers.filter(a => a.correct === false).length;
  const wrongItems = answers.filter(a => a.correct === false).map(a => ({ q: P.list[a.qi], picked: a.picked }));
  const histRight = answers.filter(a => a.correct === true).map(a => ({ q: P.list[a.qi], picked: a.picked }))
    .filter(it => it.q && ((it.q.st || {}).wrong || 0) > 0)
    .filter((it, i, arr) => arr.findIndex(x => x.q.id === it.q.id) === i);
  S.result = { right, wrong, wrongItems, histRight };
  const loc = P.chapterId ? getChapter(P.chapterId) : null;
  DB.logs.unshift({
    id: uid(), at: Date.now(), title: P.title,
    courseName: loc ? loc.c.name : '', chapterName: loc ? loc.ch.name : '',
    courseId: P.courseId, chapterId: P.chapterId, mode: P.mode,
    items: answers.map(a => ({
      qid: a.qid, stem: (P.list[a.qi] || {}).q || '',
      type: (P.list[a.qi] || {}).type || 'single', correct: a.correct
    }))
  });
  if (DB.logs.length > 300) DB.logs.length = 300;
  saveDB();
  clearSession();
  S.view = 'result';
  render();
}

/* ================= 导入保存 ================= */
async function handleFiles(files) {
  const imp = readImpForm();
  const place = placeOf(imp);
  const arr = Array.from(files || []);
  if (!arr.length) return;
  const texts = [];
  for (const f of arr) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    let text = '';
    try {
      if (ext === 'docx') {
        if (!window.mammoth) { toast('docx 解析组件未加载，请改为粘贴文字'); continue; }
        const buf = await f.arrayBuffer();
        const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
        text = r.value || '';
      } else if (ext === 'pdf') {
        toast('PDF 暂时读不了，把文字复制出来粘贴吧');
        continue;
      } else {
        text = await f.text();
      }
    } catch (e) { toast('读取 ' + f.name + ' 失败'); continue; }
    if (text.trim()) texts.push({ name: f.name, text });
  }
  if (!texts.length) return;

  if (S.impMode === 'exp') {
    const blocks = [];
    texts.forEach(t => blocks.push(...parseExplanations(t.text).items));
    if (!blocks.length) { toast('没解析出解析内容，看看下面的格式说明'); return; }
    runExpImport(blocks, place);
    return;
  }

  const all = [];
  for (const t of texts) {
    const ext = (t.name.split('.').pop() || '').toLowerCase();
    let qs = [];
    if (ext === 'json' || /^[\[{]/.test(t.text.trim())) qs = parseJSONText(t.text);
    else qs = parseQuestions(t.text);
    if (!qs.length && ext === 'json') qs = parseQuestions(t.text);
    all.push(...qs);
    if (!qs.length) toast('《' + t.name + '》里没解析出题目');
  }
  if (!all.length) return;
  if (imp.type) all.forEach(q => applyImpType(q, imp.type));
  S.preview = { questions: all, place, imp };
  S.view = 'preview';
  render();
}

function applyImpType(q, type) {
  if (type.indexOf('c:') === 0) {
    const def = DB.types.find(x => x.id === type.slice(2));
    if (def) { q.name = def.name; type = def.base; }
    else return;
  } else { q.name = ''; }
  q.type = type;
  if (type === 'short') { q.options = []; q.answer = ''; }
  if (type === 'judge') { q.options = [{ k: 'A', t: '正确' }, { k: 'B', t: '错误' }]; if (q.answer !== 'A' && q.answer !== 'B') q.answer = 'A'; }
}

async function parsePaste() {
  const imp = readImpForm();
  const place = placeOf(imp);
  const el = $('#pasteText');
  const text = el ? el.value : '';
  if (!text.trim()) { toast('先把题目粘贴进来'); return; }
  let qs = /^[\[{]/.test(text.trim()) ? parseJSONText(text) : [];
  if (!qs.length) qs = parseQuestions(text);
  if (!qs.length) { toast('没解析出题目，看看下面的格式说明'); return; }
  if (imp.type) qs.forEach(q => applyImpType(q, imp.type));
  S.preview = { questions: qs, place, imp };
  S.view = 'preview';
  render();
}

/* ---------- 导入解析 ---------- */
function parseExplanations(text) {
  const raw = String(text || '').replace(/\r/g, '');
  const blocks = [];
  let cur = null;
  const startRe = /^\s*(?:第\s*)?([0-9]{1,3})\s*(?:题)?\s*[.、．)）:：]\s*(.*)$/;
  raw.split('\n').forEach(line => {
    const m = line.match(startRe);
    if (m) { cur = { no: Number(m[1]), text: [m[2]] }; blocks.push(cur); }
    else if (cur) cur.text.push(line);
  });
  const byNo = blocks.map(b => {
    let t = b.text.join('\n').trim().replace(/^【?解析】?\s*[:：]?\s*/, '');
    return { no: b.no, text: t };
  }).filter(b => b.text);
  if (byNo.length) return { items: byNo, byNo: true };

  const items = [];
  raw.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).forEach(p => {
    const nl = p.split('\n');
    const head = nl[0].trim();
    let key = head, bodyText = nl.slice(1).join('\n').trim();
    if (/[｜|]/.test(head)) {
      const parts = head.split(/[｜|]/);
      key = parts[0].trim();
      bodyText = (parts.slice(1).join(' ') + '\n' + bodyText).trim();
    }
    items.push({ no: 0, stem: key.replace(/^解析\s*[:：]\s*/, ''), text: bodyText.replace(/^解析\s*[:：]\s*/, '').trim() });
  });
  return { items: items.filter(i => i.text && (i.stem.length >= 4 || i.text.length > 0)), byNo: false };
}

function applyExplanations(blocks, place) {
  const course = DB.courses.find(c => c.name === place.course && c.major === place.major && c.grade === place.grade);
  if (!course) return { error: '没找到科目「' + place.course + '」，先把题目导进去' };
  const chapter = course.chapters.find(ch => ch.name === place.chapter);
  if (!chapter) return { error: '没找到章节「' + place.chapter + '」' };
  const qs = chapter.questions;
  if (!qs.length) return { error: '这一章还没有题目，先导题目' };
  let ok = 0;
  const miss = [];
  blocks.forEach((b, i) => {
    let target = null;
    if (b.no && qs[b.no - 1]) target = qs[b.no - 1];
    if (!target && b.stem) {
      const key = b.stem.replace(/\s+/g, '').slice(0, 16);
      if (key.length >= 4) target = qs.find(q => q.q.replace(/\s+/g, '').indexOf(key) > -1) || null;
    }
    if (target) { target.exp = b.text; ok++; }
    else miss.push({ no: b.no, head: (b.stem || b.text).slice(0, 40), idx: i + 1 });
  });
  saveDB();
  return { ok, miss, total: qs.length, chapterId: chapter.id, courseId: course.id };
}

function runExpImport(blocks, place) {
  const r = applyExplanations(blocks, place);
  if (r.error) { toast(r.error); return; }
  S.modal = { type: 'expReport', ok: r.ok, miss: r.miss, total: r.total, place, chapterId: r.chapterId };
  render();
}

function applyExpPaste() {
  const imp = readImpForm();
  const place = placeOf(imp);
  const el = $('#pasteText');
  const text = el ? el.value : '';
  if (!text.trim()) { toast('先把解析粘贴进来'); return; }
  const parsed = parseExplanations(text);
  if (!parsed.items.length) { toast('没解析出解析内容，看看下面的格式说明'); return; }
  runExpImport(parsed.items, place);
}

function coverCounts() {
  const base = S.cover ? S.cover.base : [];
  return {
    all: base.length,
    obj: base.filter(q => q.type !== 'short').length,
    sub: base.filter(q => q.type === 'short').length,
    wrong: base.filter(q => ((q.st || {}).wrong || 0) > 0).length,
    todo: base.filter(q => (((q.st || {}).right || 0) + ((q.st || {}).wrong || 0)) === 0).length,
    fav: base.filter(q => !!q.fav).length
  };
}

function coverFiltered() {
  const C = S.cover;
  if (!C) return [];
  const base = C.base;
  if (C.filter === 'obj') return base.filter(q => q.type !== 'short');
  if (C.filter === 'sub') return base.filter(q => q.type === 'short');
  if (C.filter === 'wrong') return base.filter(q => ((q.st || {}).wrong || 0) > 0);
  if (C.filter === 'todo') return base.filter(q => (((q.st || {}).right || 0) + ((q.st || {}).wrong || 0)) === 0);
  if (C.filter === 'fav') return base.filter(q => !!q.fav);
  return base.slice();
}

function gateListHTML() {
  const q = (S.gateQ || '').trim().toLowerCase();
  const all = gateAllCodes().filter(c => !q || String(c.name || '').toLowerCase().includes(q) || String(c.code || '').toLowerCase().includes(q));
  const admin = all.filter(c => c.admin);
  const rank = st => (st.label === '已过期' ? 1e9 : (st.label === '已停用' ? 1e9 + 1 : st.days));
  const rest = all.filter(c => !c.admin).map(c => { const st = gateStatus(c); return { c, st, rk: rank(st) }; })
    .sort((a, b) => a.rk - b.rk || a.c.code.localeCompare(b.c.code));
  const groups = [];
  rest.forEach(x => {
    const key = x.st.label;
    const g = groups.find(g => g.key === key);
    if (g) g.items.push(x); else groups.push({ key, days: x.rk, items: [x] });
  });
  groups.sort((a, b) => a.days - b.days);
  let html = '';
  if (admin.length) html += `<div style="font-size:11px;color:#98adc0;margin:2px 0 2px">管理员</div>${admin.map(c => gateRowHTML(c)).join('')}`;
  if (groups.length) {
    html += groups.map(g => `<div style="font-size:11px;color:#98adc0;margin:14px 0 2px">${esc(g.key)}（${g.items.length} 人）</div>${g.items.map(x => gateRowHTML(x.c)).join('')}`).join('');
  }
  if (!html) html = '<div class="paper-hint">没有找到这个名字</div>';
  return html;
}

function startFromCover(idx) {

/* ---------- 组卷 ---------- */
function paperState() {
  if (!S.paper) S.paper = { scope: 'all', courseId: '', chapterId: '', src: 'all', share: 0.9, objN: 81, subN: 9, count: 90, shuffle: true };
  const ps = S.paper;
  if (ps.objN == null || ps.subN == null) {
    const t = Math.max(1, Number(ps.count) || 90);
    ps.objN = Math.round(t * 0.9); ps.subN = t - ps.objN;
  }
  if (ps.share == null) ps.share = 0.9;
  return ps;
}

function paperPools() {
  const ps = paperState();
  let arr = [];
  if (ps.scope === 'chapter' && ps.chapterId) {
    const f = getChapter(ps.chapterId);
    if (f) arr = f.ch.questions.slice();
  } else if (ps.scope === 'course' && ps.courseId) {
    const c = getCourse(ps.courseId);
    if (c) c.chapters.forEach(ch => arr.push(...ch.questions));
  } else {
    DB.courses.forEach(c => c.chapters.forEach(ch => arr.push(...ch.questions)));
  }
  if (ps.src === 'done') arr = arr.filter(q => ((q.st || {}).right || 0) + ((q.st || {}).wrong || 0) > 0);
  else if (ps.src === 'wrong') arr = arr.filter(q => ((q.st || {}).wrong || 0) > 0);
  else if (ps.src === 'fav') arr = arr.filter(q => !!q.fav);
  return { obj: arr.filter(q => q.type !== 'short'), sub: arr.filter(q => q.type === 'short') };
}

function paperCandidates() { const p = paperPools(); return p.obj.concat(p.sub); }

function paperScopeTitle() {
  const ps = paperState();
  if (ps.scope === 'chapter' && ps.chapterId) {
    const f = getChapter(ps.chapterId);
    if (f) return f.c.name + ' · ' + f.ch.name;
  }
  if (ps.scope === 'course' && ps.courseId) {
    const c = getCourse(ps.courseId);
    if (c) return c.name;
  }
  return '全部题库';
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildPaperList() {
  const ps = paperState();
  const pools = paperPools();
  const nO = Math.max(0, Math.min(Number(ps.objN) || 0, pools.obj.length));
  const nS = Math.max(0, Math.min(Number(ps.subN) || 0, pools.sub.length));
  let list = shuffleArr(pools.obj.slice()).slice(0, nO).concat(shuffleArr(pools.sub.slice()).slice(0, nS));
  if (ps.shuffle) shuffleArr(list);
  return list;
}

function pdate(ts) {

const MARK_NAMES = { hl: '高光', ul: '横线', circle: '圈圈' };
const HL_NAMES = { y: '黄色高亮', r: '红色高亮', b: '蓝色高亮', ul: '蓝色下划线', wavy: '橙红波浪', circle: '绿色圈' };

function qMarksLines(q) {
  const out = [];
  (q.marks || []).forEach(m => {
    const t = (q.q || '').slice(m.s, m.e).trim();
    if (t) out.push('题干（' + (MARK_NAMES[m.k] || '标记') + '）：' + t);
  });
  (q.hl || []).forEach(h => {
    const t = (q.exp || '').slice(h.s, h.e).trim();
    if (t) out.push('解析（' + (HL_NAMES[h.c] || '标记') + '）：' + t);
  });
  return out;
}

function qTypeName(q) {
  return q.type === 'multi' ? '多选题' : q.type === 'judge' ? '判断题' : q.type === 'short' ? '主观题' : '单选题';
}

function qFullText(q, i, withNo) {
  const lines = [];
  lines.push((typeof i === 'number' ? (i + 1) + '. ' : '') + '【' + qTypeName(q) + '】' + String(q.q || ''));
  if (q.type !== 'short' && (q.options || []).length) {
    q.options.forEach(o => lines.push('   ' + o.k + '. ' + o.t + (String(q.answer || '').indexOf(o.k) > -1 ? '  ← 正确答案' : '')));
  }
  if (q.type === 'short') lines.push('   参考答案：' + (q.exp || '（暂无）'));
  else if (String(q.answer || '').indexOf(',') === -1 && (q.answer || '').length > 1) lines.push('   正确答案：' + String(q.answer).split('').join('、'));
  else if ((q.answer || '').length > 1) lines.push('   正确答案：' + String(q.answer).split('').join('、'));
  else lines.push('   正确答案：' + (q.answer || '（未设）'));
  if (q.type !== 'short') {
    lines.push('   解析：' + (q.exp ? q.exp.replace(/\n/g, '\n      ') : '（暂无解析）'));
  }
  const mk = qMarksLines(q);
  if (mk.length) {
    lines.push('   我标出的重点：');
    mk.forEach(x => lines.push('     · ' + x));
  }
  return lines.join('\n');
}

function qStemOnly(q, i) {
  const lines = [];
  lines.push((typeof i === 'number' ? (i + 1) + '. ' : '') + '【' + qTypeName(q) + '】' + String(q.q || ''));
  if (q.type !== 'short' && (q.options || []).length) {
    q.options.forEach(o => lines.push('   ' + o.k + '. ' + o.t + (String(q.answer || '').indexOf(o.k) > -1 ? '  ← 正确答案' : '')));
  } else if (q.type === 'short') {
    lines.push('   （主观题，无选项）');
  }
  lines.push('   正确答案：' + (q.answer ? String(q.answer).split('').join('、') : (q.type === 'short' ? '见解析' : '（未设）')));
  const mk = (q.marks || []).map(m => ({ t: (q.q || '').slice(m.s, m.e).trim(), k: m.k })).filter(x => x.t);
  if (mk.length) {
    lines.push('   题干标记：');
    mk.forEach(x => lines.push('     · ' + (MARK_NAMES[x.k] || '标记') + '：' + x.t));
  }
  return lines.join('\n');
}

function qExpOnly(q, i) {
  const lines = [];
  lines.push((typeof i === 'number' ? (i + 1) + '. ' : '') + '【' + qTypeName(q) + '】' + String(q.q || '').slice(0, 40) + (String(q.q || '').length > 40 ? '…' : ''));
  lines.push('   ' + (q.type === 'short' ? '参考答案' : '解析') + '：' + ((q.exp || '').trim() || '（暂无）'));
  const hs = (q.hl || []).map(h => ({ t: (q.exp || '').slice(h.s, h.e).trim(), c: h.c })).filter(x => x.t);
  if (hs.length) {
    lines.push('   解析标记：');
    hs.forEach(x => lines.push('     · ' + (HL_NAMES[x.c] || '标记') + '：' + x.t));
  }
  return lines.join('\n');
}

function qListStemText(list, title) {
  return title + '（只有题目）\n\n' + list.map((q, i) => qStemOnly(q, i)).join('\n\n');
}

function qListExpText(list, title) {
  const has = list.filter(q => (q.exp || '').trim()).length;
  return title + '（只有解析 · ' + has + '/' + list.length + ' 题有解析）\n\n' + list.map((q, i) => qExpOnly(q, i)).join('\n\n');
}

function qListFullText(list, title) {
  return title + '\n\n' + list.map((q, i) => qFullText(q, i)).join('\n\n');
}

function marksText(list, title) {
  const blocks = [];
  list.forEach((q, i) => {
    const lines = qMarksLines(q);
    if (!lines.length) return;
    blocks.push((i + 1) + '. ' + String(q.q || '').replace(/\n/g, ' ') + '\n' + lines.map(x => '   · ' + x).join('\n'));
  });
  return title + '\n\n' + (blocks.join('\n\n') || '（这些题还没有标记过的知识点）');
}

function paperText(list, withExp) {
  return list.map((q, i) => {
    let out = (i + 1) + '. ' + q.q;
    if (q.type !== 'short') out += '\n' + q.options.map(o => o.k + '. ' + o.t).join('\n');
    if (q.type === 'short') out += '\n答案：' + (q.exp || '（暂无参考答案）');
    else out += '\n答案：' + (q.answer || '');
    if (withExp && q.exp && q.type !== 'short') out += '\n解析：' + q.exp;
    return out;
  }).join('\n\n');
}

function exportPaper(withExp) {
  const list = buildPaperList();
  if (!list.length) { toast('这个范围里没有题目'); return; }
  const title = paperScopeTitle().replace(/\s*·\s*/g, '_');
  download('组卷_' + title + '_' + list.length + '题' + (withExp ? '_含解析' : '') + '_' + dstr(Date.now()) + '.txt', paperText(list, withExp));
  toast('已导出 ' + list.length + ' 题' + (withExp ? '（含解析）' : '（不含解析）'));
}

function savePreview() {
  const pv = S.preview;
  if (!pv || !pv.questions.length) { toast('没有可保存的题目'); return; }
  const place = pv.place;
  let course = DB.courses.find(c => c.name === place.course && c.major === place.major && c.grade === place.grade);
  if (!course) {
    course = { id: uid(), name: place.course, major: place.major, grade: place.grade, createdAt: Date.now(), chapters: [] };
    DB.courses.push(course);
  }
  let chapter = course.chapters.find(ch => ch.name === place.chapter);
  if (!chapter) {
    chapter = { id: uid(), name: place.chapter, questions: [] };
    course.chapters.push(chapter);
  }
  const added = pv.questions.length;
  pv.questions.forEach(q => {
    chapter.questions.push({
      id: uid(), name: q.name || '', type: q.type, q: q.q, options: q.options || [], answer: q.answer || '',
      exp: q.exp || '', hl: (q.hl || []).slice(), images: (q.images || []).slice(), st: { right: 0, wrong: 0, last: 0 }
    });
  });
  saveDB();
  const cid = course.id, chid = chapter.id;
  S.preview = null;
  S.chapterId = chid;
  startPractice(chapter.questions.slice(), { title: place.course + ' · ' + place.chapter, courseId: cid, chapterId: chid });
  toast('已存入《' + place.course + ' / ' + place.chapter + '》，共 ' + added + ' 题');
}

/* ================= 题目编辑器 ================= */
function openEditQ(q, isNew, ctx) {
  S.modal = { type: 'editQ', q: JSON.parse(JSON.stringify(q)), isNew, ctx };
  render();
}

function collectEditor() {
  const m = S.modal;
  if (!m || (m.type !== 'editQ' && m.type !== 'editExp')) return;
  const q = m.q;
  const body = $('#mQ');
  if (body) q.q = body.value;
  const rows = $$('.opt-edit-row');
  if (q.type !== 'judge' && rows.length) {
    q.options = rows.map(r => ({ k: r.dataset.k, t: (r.querySelector('input') || {}).value || '' }));
  }
  const exp = $('#mExp');
  if (exp) q.exp = exp.value;
}

function normalizeQ(q) {
  if (q.type === 'judge') {
    q.options = [{ k: 'A', t: '正确' }, { k: 'B', t: '错误' }];
    q.answer = q.answer === 'B' ? 'B' : 'A';
  }
  if (q.type === 'short') { q.options = []; q.answer = ''; }
  if (q.type === 'single') q.answer = (q.answer || '').slice(0, 1);
  if (q.type === 'multi') q.answer = (q.answer || '').split('').filter(x => /[A-H]/.test(x)).sort().join('');
  return q;
}

function saveEditor() {
  const m = S.modal;
  if (!m || (m.type !== 'editQ' && m.type !== 'editExp')) return;
  if (!m.ctx) m.ctx = { kind: 'db', qid: (m.q || {}).id };
  try { saveEditorInner(m); } catch (err) {
    toast('保存失败：' + (err && err.message ? err.message : '未知错误'));
  }
}
function saveEditorInner(m) {
  collectEditor();
  const q = normalizeQ(m.q);
  q.q = q.q.trim();
  q.hl = (q.hl || []).map(h => ({ s: Math.max(0, Math.min(Number(h.s) || 0, q.exp.length)), e: Math.max(0, Math.min(Number(h.e) || 0, q.exp.length)), c: h.c })).filter(h => h.e > h.s);
  if (!q.q) { toast('题干不能为空'); return; }
  if (q.type !== 'short') {
    q.options = q.options.filter(o => o.t.trim());
    if (q.options.length < 2) { toast('至少要有两个选项'); return; }
    if (!q.answer) { toast('记得选正确答案'); return; }
    if (q.type === 'judge') q.options = [{ k: 'A', t: '正确' }, { k: 'B', t: '错误' }];
    q.options = q.options.map((o, i) => ({ k: String.fromCharCode(65 + i), t: o.t.trim() }));
    if (q.type === 'multi') q.answer = q.answer.split('').filter(x => x.charCodeAt(0) - 65 < q.options.length).sort().join('');
    if (!q.answer) { toast('答案超出了选项范围'); return; }
  }
  const ctx = m.ctx;
  if (ctx.kind === 'preview') {
    S.preview.questions[ctx.idx] = q;
  } else if (ctx.kind === 'new') {
    const f = getChapter(ctx.chapterId);
    if (f) {
      f.ch.questions.push({ id: uid(), name: q.name || '', type: q.type, q: q.q, options: q.options, answer: q.answer, exp: q.exp, hl: q.hl || [], images: q.images, st: { right: 0, wrong: 0, last: 0 } });
      saveDB();
    }
  } else if (ctx.kind === 'db') {
    const f = findQ(ctx.qid);
    if (f) {
      const old = f.q;
      if (old.q !== q.q) { old.marks = []; old.hl = []; }
      old.name = q.name || ''; old.type = q.type; old.q = q.q; old.options = q.options; old.answer = q.answer; old.exp = q.exp; old.hl = q.hl || [];
      old.images = q.images;
      saveDB();
    }
  }
  S.modal = null;
  if (ctx.kind === 'db' && S.view === 'qdetail' && S.qBack) {
    const b = S.qBack;
    if (!b.view || b.view === 'qdetail') { b.view = 'chapter'; }
    if (b.view === 'chapter' && !S.chapterId) b.view = 'home';
    if (b.view === 'book' && b.bookTab === 'issue') {
      const f = findQ(ctx.qid); if (f) delete f.q.issue;
      saveDB();
    }
    S.view = b.view || 'chapter';
    if (b.bookTab) S.bookTab = b.bookTab;
    if (b.searchTab) S.searchTab = b.searchTab;
    if (b.date) S.date = b.date;
    if (b.bookCourse !== undefined) S.bookCourse = b.bookCourse;
  }
  render();
  toast('已保存');
}

/* ================= 交互 ================= */
function go(view) { S.view = view; S.modal = null; if (view === 'import') S.impMode = 'q'; render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'overlayClose') {
    if (e.target === el) { S.modal = null; render(); }
    return;
  }

  switch (act) {
    case 'go': go(el.dataset.view); break;
    case 'goSearch': S.view = 'search'; S.searchTab = 'kw'; S.modal = null; render(); break;
    case 'goDates': S.view = 'search'; S.searchTab = 'date'; S.date = todayStr(); S.modal = null; render(); break;
    case 'goBook': S.view = 'book'; S.bookTab = el.dataset.tab || 'wrong'; S.bookCourse = ''; S.modal = null; render(); break;
    case 'bookTab': S.bookTab = el.dataset.t; render(); break;
    case 'bookCourse': S.bookCourse = el.dataset.id || ''; render(); break;
    case 'practiceBook': {
      const arr = bookList().map(x => x.q);
      if (!arr.length) { toast('这里还没有题'); break; }
      startPractice(arr, { title: ({ wrong: '错题', right: '做对过', done: '做过的', fav: '收藏' }[S.bookTab] || '练习') + ' · ' + arr.length + ' 题', mode: 'book' });
      break;
    }
    case 'courseWrong': {
      const c = getCourse(el.dataset.id);
      if (c) { S.view = 'book'; S.bookTab = 'wrong'; S.bookCourse = c.id; S.modal = null; render(); }
      break;
    }
    case 'courseSheet': {
      const c = getCourse(el.dataset.id);
      if (c) { S.modal = { type: 'courseSheet', id: c.id }; render(); }
      break;
    }
    case 'courseImport': {
      const c = getCourse(S.modal.id);
      S.modal = null;
      if (c) { S.imp = { major: c.major, grade: c.grade, course: c.name }; S.view = 'import'; render(); }
      break;
    }
    case 'courseNewChapter': { const cid = S.modal.id; S.modal = { type: 'newChapter', courseId: cid }; render(); break; }
    case 'courseRename': { const c = getCourse(S.modal.id); S.modal = null; if (c) { S.modal = { type: 'renameCourse', id: c.id, value: c.name }; render(); } const i = $('#mcName'); if (i) { i.focus(); i.select(); } break; }
    case 'courseDel': { const c = getCourse(S.modal.id); if (c) { S.modal = { type: 'delCourse', id: c.id, value: c.name, count: qCount(c) }; render(); } break; }
    case 'searchTab': S.searchTab = el.dataset.t; render(); break;

    case 'editProfile': S.modal = { type: 'profile' }; render(); break;
    case 'pickMajor': {
      const i = $('#pfMajor'); if (i) i.value = el.dataset.v;
      $$('.seg button[data-act=pickMajor]').forEach(b => b.classList.toggle('on', b === el));
      break;
    }
    case 'pickGrade': {
      $$('.seg button[data-act=pickGrade]').forEach(b => b.classList.toggle('on', b === el));
      break;
    }

    case 'openCourse': S.courseId = el.dataset.id; S.view = 'course'; S.modal = null; render(); break;
    case 'openChapter':
      if (S.holdAt && Date.now() - S.holdAt < 500) break; S.chapterId = el.dataset.id; S.qFilter = 'all'; S.view = 'chapter'; S.modal = null; render(); break;
    case 'selAll': {
      const f = getChapter(S.chapterId);
      if (!f) break;
      const all = f.ch.questions;
      const list = S.qFilter === 'obj' ? all.filter(isObj) : S.qFilter === 'sub' ? all.filter(q => !isObj(q)) : S.qFilter === 'wrong' ? all.filter(q => q.st.wrong > 0) : all;
      S.sel = list.map(q => q.id);
      render();
      break;
    }
    case 'selExit': S.sel = null; render(); break;
    case 'selMove': if (S.sel && S.sel.length) { S.modal = { type: 'selMove' }; render(); } break;
    case 'selDel': if (S.sel && S.sel.length) { S.modal = { type: 'selDel' }; render(); } break;
    case 'selDoMove': {
      const to = el.dataset.to;
      const f = getChapter(S.chapterId), g = getChapter(to);
      if (!f || !g) break;
      const ids = (S.sel || []).slice();
      const moved = [];
      f.ch.questions = f.ch.questions.filter(q => { if (ids.indexOf(q.id) > -1) { moved.push(q); return false; } return true; });
      g.ch.questions = g.ch.questions.concat(moved);
      S.sel = null; S.modal = null; saveDB(); render();
      toast('已把 ' + moved.length + ' 题移到「' + g.ch.name + '」');
      break;
    }
    case 'selDoDel': {
      const f = getChapter(S.chapterId);
      if (!f) break;
      const ids = (S.sel || []).slice();
      const n = ids.length;
      f.ch.questions = f.ch.questions.filter(q => ids.indexOf(q.id) < 0);
      S.sel = null; S.modal = null; saveDB(); render();
      toast('已删除 ' + n + ' 题');
      break;
    }
    case 'openQ': {
      if (S.sel) { selToggle(el.dataset.qid); break; }
      if (S.favAt && Date.now() - S.favAt < 500) break;
      if (S.swipeAt && Date.now() - S.swipeAt < 500) break;
      const f = findQ(el.dataset.qid);
      if (!f) { toast('题目已删除'); break; }
      S.qid = el.dataset.qid; S.chapterId = f.ch.id;
      S.qBack = { view: S.view, bookTab: S.bookTab, searchTab: S.searchTab, date: S.date, bookCourse: S.bookCourse };
      S.view = 'qdetail'; S.modal = null; render(); break;
    }
    case 'qBack': {
      const b = S.qBack || { view: 'chapter' };
      S.view = (b.view && b.view !== 'qdetail') ? b.view : 'chapter';
      if (S.view === 'chapter' && !S.chapterId) S.view = 'home';
      if (S.view === 'book' && !S.bookTab) S.bookTab = 'wrong';
      if (b.bookTab) S.bookTab = b.bookTab;
      if (b.searchTab) S.searchTab = b.searchTab;
      if (b.date) S.date = b.date;
      if (b.bookCourse !== undefined) S.bookCourse = b.bookCourse;
      S.modal = null; render(); break;
    }
    case 'openLog': {
      const l = DB.logs.find(x => x.id === el.dataset.id);
      if (l) { S.view = 'search'; S.searchTab = 'date'; S.date = dstr(l.at); render(); }
      break;
    }

    case 'qmenuEdit': {
      const f = findQ(el.dataset.qid);
      S.modal = null;
      if (f) openEditQ(f.q, false, { kind: 'db', qid: f.q.id });
      break;
    }
    case 'expQStem': {
      const f = findQ(el.dataset.qid); S.modal = null;
      if (!f) break;
      download('题目_' + f.ch.name.replace(/\s+/g, '') + '_' + f.q.id.slice(0, 6) + '.txt', qStemOnly(f.q, 0));
      render(); toast('已导出题目');
      break;
    }
    case 'expQExp': {
      const f = findQ(el.dataset.qid); S.modal = null;
      if (!f) break;
      const t = f.q.exp ? qExpOnly(f.q, 0) : '这道题还没有解析。';
      if (!f.q.exp) { render(); toast('这道题还没有解析'); break; }
      download('解析_' + f.ch.name.replace(/\s+/g, '') + '_' + f.q.id.slice(0, 6) + '.txt', t);
      render(); toast('已导出解析');
      break;
    }
    case 'expQAll': {
      const f = findQ(el.dataset.qid); S.modal = null;
      if (!f) break;
      download('题目解析_' + f.ch.name.replace(/\s+/g, '') + '_' + f.q.id.slice(0, 6) + '.txt', qFullText(f.q));
      render(); toast('已导出题目和解析');
      break;
    }
    case 'qmenuFav': { const qid = el.dataset.qid; S.modal = null; toggleFav(qid); break; }
    case 'qmenuDel': { const qid = el.dataset.qid; S.modal = null; removeQuestion(qid); break; }
    case 'manageCourses': S.view = 'manage'; render(); break;
    case 'newCourse': S.modal = { type: 'newCourse' }; render(); break;
    case 'courseMove': {
      const id = el.dataset.id, d = Number(el.dataset.d) || 0;
      const i = DB.courses.findIndex(c => c.id === id);
      const j = i + d;
      if (i < 0 || j < 0 || j >= DB.courses.length) break;
      const tmp = DB.courses[i]; DB.courses[i] = DB.courses[j]; DB.courses[j] = tmp;
      saveDB(); render();
      break;
    }
    case 'courseTop': {
      const id = el.dataset.id;
      const i = DB.courses.findIndex(c => c.id === id);
      if (i < 0) break;
      const c = DB.courses[i];

      GATE = { code: '', name: '', at: 0 };
      if (S.covers) S.covers = null;
      S.view = 'gate'; S.modal = null; render();
      toast('已退出这台设备');
      break;
    }
    case 'coverReset': {
      const C = S.cover;
      if (!C) break;
      S.modal = { type: 'coverReset', n: C.base.length };
      render(); break;
    }
    case 'coverResetOk': {
      const C = S.cover;
      if (C) {
        const ids = new Set(C.base.map(q => q.id));
        DB.courses.forEach(c => (c.chapters || []).forEach(ch => (ch.questions || []).forEach(q => {
          if (ids.has(q.id)) q.st = { right: 0, wrong: 0, last: 0 };
        })));
        C.base.forEach(q => { q.st = { right: 0, wrong: 0, last: 0 }; });
        saveDB();
      }
      S.modal = null; render(); toast('已全部清零');
      break;
    }
    case 'coverJump': startFromCover(Number(el.dataset.i) || 0); break;
    case 'coverClose': {
      const C = S.cover;
      S.cover = null;
      S.view = C && C.chapterId ? 'chapter' : (C && C.courseId ? 'course' : 'home');
      render();
      break;
    }
    case 'toggleRandom': S.randomPref = !S.randomPref; render(); break;
    case 'startPractice': {
      const sc = S.modal.scope;
      const mode = el.dataset.scope;
      let arr = practiceList(sc.courseId, sc.chapterId);
      if (mode === 'obj') arr = arr.filter(q => q.type !== 'short');
      else if (mode === 'sub') arr = arr.filter(q => q.type === 'short');
      else if (mode === 'wrong') arr = arr.filter(q => q.st.wrong > 0);
      if (!arr.length) { toast('这个范围里没有题目'); break; }
      S.modal = null;
      startPractice(arr, { title: sc.title, courseId: sc.courseId, chapterId: sc.chapterId, mode, random: S.randomPref });
      break;
    }

    case 'impMode': S.impMode = el.dataset.m === 'exp' ? 'exp' : 'q'; render(); break;
    case 'impModeGo': S.impMode = el.dataset.m === 'exp' ? 'exp' : 'q'; S.view = 'import'; render(); break;
    case 'applyExpPaste': applyExpPaste(); break;
    case 'gotoChapter': S.modal = null; S.view = 'chapter'; S.chapterId = el.dataset.id; render(); break;
    case 'goPaper': S.view = 'paper'; S.modal = null; render(); break;
    case 'paperScope': paperState().scope = el.dataset.v; render(); break;
    case 'paperSrc': paperState().src = el.dataset.v; render(); break;
    case 'paperShare': {
      const ps = paperState();
      ps.share = Number(el.dataset.v);
      const t = Math.max(0, (Number(ps.objN) || 0) + (Number(ps.subN) || 0)) || 90;
      ps.objN = Math.round(t * ps.share);
      ps.subN = Math.max(0, t - ps.objN);
      render();
      break;
    }
    case 'paperCourse': paperState().courseId = el.value; paperState().chapterId = ''; render(); break;
    case 'paperChapter': paperState().chapterId = el.value; render(); break;
    case 'paperQuick': {
      const ps = paperState();
      const t = Number(el.dataset.v);
      ps.objN = Math.round(t * ps.share); ps.subN = t - ps.objN;
      render();
      break;
    }
    case 'paperCount': {
      const ps = paperState();
      const t = Math.max(1, Number(el.value) || 90);
      ps.objN = Math.round(t * ps.share); ps.subN = t - ps.objN;
      render();
      break;
    }
    case 'paperObjN': { const ps = paperState(); ps.objN = Math.max(0, Number(el.value) || 0); render(); break; }
    case 'paperSubN': { const ps = paperState(); ps.subN = Math.max(0, Number(el.value) || 0); render(); break; }
    case 'genPaper': genPaper(); break;
    case 'redoPaper': openPaperRec(el.dataset.id); break;
    case 'delPaper': delPaperRec(el.dataset.id); break;
    case 'renamePaperAsk': {
      const pr = (DB.papers || []).find(x => x.id === el.dataset.id);
      S.holdAt = Date.now();
      S.modal = { type: 'renamePaper', id: el.dataset.id, value: pr ? (pr.name || '') : '' };
      render(); break;
    }
    case 'recitePaper': recitePaper(); break;
    case 'exportPaper': exportPaper(el.dataset.exp === '1'); break;
    case 'reciteChapter': {
      const f = getChapter(el.dataset.id);
      if (!f || !f.ch.questions.length) { toast('这一章还没有题目'); break; }
      S.modal = null;
      startRecite(f.ch.questions.slice(), f.c.name + ' · ' + f.ch.name);
      break;
    }
    case 'exitRecite': {
      S.recite = null;
      S.view = S.chapterId ? 'chapter' : 'home';
      render();
      break;
    }
    case 'reciteToggle': if (S.recite) { S.recite.revealed = !S.recite.revealed; render(); } break;
    case 'recitePrev': if (S.recite && S.recite.idx > 0) { S.recite.idx--; S.recite.revealed = false; render(); } break;
    case 'reciteNext': {
      const R2 = S.recite;
      if (!R2) break;
      if (R2.idx + 1 >= R2.list.length) { toast('背完 ' + R2.list.length + ' 题了'); S.view = 'home'; S.recite = null; render(); break; }
      R2.idx++; R2.revealed = false; render(); break;
    }
    case 'openPalette': if (S.practice) { S.modal = { type: 'palette' }; render(); } break;
    case 'jumpTo': {
      const P = S.practice;
      if (P) {
        P.idx = Number(el.dataset.i) || 0;
        loadAnswerState(P);
        saveSession();
      }
      S.modal = null; render(); break;
    }
    case 'paperFinish': S.modal = null; if (S.practice) finish(); break;

    case 'pick': pick(el.dataset.k); break;
    case 'submitMulti': submitMulti(); break;
    case 'reveal': reveal(); break;
    case 'self': selfJudge(Number(el.dataset.ok) === 1); break;
    case 'next': advance(); break;
    case 'qdNav': {
      const f = findQ(S.qid);
      if (!f) break;
      const i = f.ch.questions.findIndex(x => x.id === f.q.id);
      const j = i + (Number(el.dataset.d) || 0);
      if (j < 0) { toast('已是本章第一题'); break; }
      if (j >= f.ch.questions.length) { toast('已是本章最后一题'); break; }
      S.qid = f.ch.questions[j].id;
      S.view = 'qdetail';
      render();
      break;
    }
    case 'prevQ': {
      const P = S.practice;
      if (!P || P.idx === 0) break;
      P.idx--;
      loadAnswerState(P);
      removeMarkBar(); saveSession(); render();
      break;
    }
    case 'favQ': { toggleFav(el.dataset.qid); break; }
    case 'toggleExcl': {
      const P = S.practice; if (!P) break;
      P.excl = P.excl || {};
      const k = el.dataset.k;
      P.excl[k] = !P.excl[k];
      render();
      toast(P.excl[k] ? '已排除 ' + k : '已恢复 ' + k);
      break;
    }
    case 'markSel': {
      const ms = S.markSel;
      if (!ms) { toast('先选中要标记的文字'); break; }
      const f = findQ(ms.qid);
      if (!f) break;
      f.q.marks = (f.q.marks || []);
      f.q.marks.push({ s: ms.s, e: ms.e, k: el.dataset.k });
      saveDB();
      removeMarkBar();
      render();
      break;
    }
    case 'markClose': removeMarkBar(); break;
    case 'exportAll': exportAllData(); break;
    case 'pickRestore': { const inp = document.getElementById('restoreFile'); if (inp) inp.click(); break; }
    case 'resumeSession': {
      const d = loadSession();
      if (!d) { toast('没有可继续的练习'); break; }
      S.practice = {
        list: d.list, idx: Math.min(d.idx, d.list.length - 1), answers: d.answers || [],
        picked: null, multiSel: [], submitted: false, revealed: false, judged: null, correct: null,
        title: d.title, courseId: d.courseId, chapterId: d.chapterId, mode: d.mode
      };
      loadAnswerState(S.practice);
      S.view = 'practice';
      render();
      break;
    }
    case 'dropSession': { clearSession(); toast('已清掉上次进度'); render(); break; }
    case 'exitPractice': {
      const P = S.practice;
      if (P && P.chapterId) { S.view = 'chapter'; S.chapterId = P.chapterId; }
      else if (P && P.courseId) { S.view = 'course'; S.courseId = P.courseId; }
      else S.view = 'home';
      S.practice = null; render();
      break;
    }
    case 'exitResult': {
      const P = S.practice;
      if (P && P.chapterId) { S.view = 'chapter'; S.chapterId = P.chapterId; }
      else S.view = 'home';
      render();
      break;
    }
    case 'restart': {
      const P = S.practice;
      if (P) startPractice(P.list.slice(), { title: P.title, courseId: P.courseId, chapterId: P.chapterId, mode: P.mode });
      break;
    }
    case 'practiceWrong': {
      const P = S.practice, R = S.result;
      const list = R.wrongItems.map(i => i.q);
      if (!list.length) { toast('没有错题'); break; }
      startPractice(list, { title: P.title + ' · 错题', courseId: P.courseId, chapterId: P.chapterId, mode: 'wrong' });
      break;
    }

    case 'downloadTemplate': {
      download('题目模板.txt', '1. 题干可以写多行，第二行也会接在题干后面\nA. 选项一\nB. 选项二\nC. 选项三\nD. 选项四\n答案：A\n解析：解析可以写多行，直到下一题为止。\n\n2. 肝素通过增强抗凝血酶Ⅲ活性发挥抗凝作用。\nA. 正确\nB. 错误\n答案：A\n解析：判断题写成正确 / 错误就行。\n\n3. 简述肝素的抗凝机制。\n答案：肝素与抗凝血酶Ⅲ结合，使其活性增强，加速灭活凝血酶及 Xa 因子。\n');
      break;
    }
    case 'fillTemplate': {
      const t = $('#pasteText');
      if (t) {
        t.value = '一、单选题\n1. 条件致病菌的准确含义是？\nA. 任何时候都致病的细菌\nB. 正常菌群在特定条件下与宿主关系失衡而致病\nC. 只感染动物的细菌\nD. 只存在于体外的细菌\n答案：B\n解析：正常菌群在免疫力下降、菌群移位或菌群失调时才致病。\n\n2. 心室肌细胞动作电位平台期主要由哪种离子流形成？\nA. Na+ 快内流\nB. Ca2+ 缓慢内流与 K+ 外流\nC. Cl- 外流\nD. K+ 内流\n答案：B\n解析：平台期由 L 型钙通道的 Ca2+ 缓慢内流与钾外流共同维持。\n\n二、多选题\n3. 下列属于条件致病菌的有？\nA. 大肠埃希菌\nB. 金黄色葡萄球菌\nC. 结核分枝杆菌\nD. 铜绿假单胞菌\n答案：ABD\n解析：三者都是正常菌群或环境菌，在特定条件下致病。\n\n三、判断题\n4. 肝素通过增强抗凝血酶Ⅲ的活性发挥抗凝作用。\nA. 正确\nB. 错误\n答案：A\n解析：正确，这是肝素抗凝的核心机制。\n\n四、简答题\n5. 简述肝素的抗凝机制。\n答案：肝素与抗凝血酶Ⅲ结合，使其构象改变、活性显著增强，从而加速灭活凝血酶及 Xa 等凝血因子。\n';
        t.focus();
        toast('已填入示例，可以直接点“解析这段文字”');
      }
      break;
    }
    case 'demo': demo(); break;

    case 'modalClose': S.modal = null; render(); break;
    case 'modalOk': modalOk(); break;
  }
});

function currentProfileGrade() {
  const on = $('.seg button.on[data-act="pickGrade"]');
  return on ? on.dataset.v : '';
}

function modalOk() {
  const m = S.modal;
  if (!m) return;
  if (m.type === 'profile') {
    const major = ($('#pfMajor') || {}).value.trim();
    const grade = currentProfileGrade();
    if (!major) { toast('先填写专业'); return; }
    if (!grade) { toast('点一个年级'); return; }
    DB.profile = { major, grade };
    saveDB(); S.modal = null; render(); toast('已切换为 ' + major + ' · ' + grade);
  } else if (m.type === 'newCourse') {
    const name = ($('#ncName') || {}).value.trim();
    const major = ($('#ncMajor') || {}).value.trim() || DB.profile.major;
    const grade = ($('#ncGrade') || {}).value || DB.profile.grade;
    if (!name) { toast('给科目起个名字'); return; }
    if (DB.courses.some(c => c.name === name && c.major === major && c.grade === grade)) { toast('这个专业年级下已经有同名科目'); return; }
    const c = { id: uid(), name, major, grade, createdAt: Date.now(), chapters: [] };
    DB.courses.push(c); saveDB();
    S.courseId = c.id; S.modal = null; S.view = 'course'; render();
  } else if (m.type === 'renameCourse') {
    const v = ($('#mcName') || {}).value.trim();
    const c = getCourse(m.id);
    if (c && v) { c.name = v; saveDB(); toast('已重命名'); }
    S.modal = null; render();
  } else if (m.type === 'delCourse') {
    DB.courses = DB.courses.filter(c => c.id !== m.id);
    DB.logs = DB.logs.filter(l => l.courseId !== m.id);
    saveDB(); S.modal = null; S.view = 'browse'; render(); toast('已删除');
  } else if (m.type === 'newFolder') {
    const v = ($('#mfoName') || {}).value.trim();
    const c = getCourse(m.courseId);
    if (!v) { toast('给文件夹起个名字'); return; }
    if (!c) { S.modal = null; render(); return; }
    c.folders = c.folders || [];
    if (c.folders.includes(v) || c.chapters.some(ch => ch.folder === v)) { toast('已经有同名文件夹'); return; }
    c.folders.push(v); saveDB();
    S.modal = null; render(); toast('已新建文件夹「' + v + '」');
  } else if (m.type === 'gateDel') {
    const code0 = String(m.code || '').toUpperCase();
    if (GATE_CODES.some(x => x.code.toUpperCase() === code0)) { toast('管理员自己的码不能删'); S.modal = null; render(); }
    else { gateSetStore(gateStore().filter(x => x.code.toUpperCase() !== code0)); S.modal = null; render(); toast('已删除'); }
  } else if (m.type === 'gateNew' || m.type === 'gateEdit') {
    const name = (($('#gName') || {}).value || '').trim();
    const start = (($('#gStart') || {}).value || '').trim();
    const end = (($('#gEnd') || {}).value || '').trim();
    if (!name) { toast('写上姓名'); return; }
    if (start && end && end < start) { toast('结束日期早于开始日期'); return; }
    const list = gateStore();
    if (m.type === 'gateEdit') {
      const code0 = String(m.code || '').toUpperCase();
      const i = list.findIndex(x => x.code.toUpperCase() === code0);
      const cur = gateAllCodes().find(x => x.code.toUpperCase() === code0) || {};
      let nv = { code: (($('#gCode') || {}).value || cur.code || '').trim().toUpperCase(), name, start, end, on: cur.on !== false, admin: false };
      if (!nv.code) { toast('码不能空'); return; }
      const dup = gateAllCodes().some(x => x.code.toUpperCase() === nv.code && x.code.toUpperCase() !== code0);
      if (dup) { toast('这个码已经有人用了'); return; }
      if (i >= 0) list[i] = nv; else list.push(nv);
      gateSetStore(list);
      S.modal = null; render(); toast('已保存 ' + name);
      return;
    }
    const tab = S.gNewTab === 'self' ? 'self' : 'sys';
    let code = (($('#gCode') || {}).value || '').trim().toUpperCase();
    if (tab === 'self' && !code) { toast('写上自己定的码'); return; }
    if (!code) code = gateSysCode(start);
    if (gateAllCodes().some(x => x.code.toUpperCase() === code)) { toast('这个码已经有人用了'); return; }
    list.push({ code, name, start, end, on: true, admin: false });
    gateSetStore(list);
    S.modal = null; render();
    toast('已添加 ' + name + '：' + code);
    S.holdAt = 0;
  } else if (m.type === 'adminPw') {
    const v = (($('#gatePw') || {}).value || '').trim();
    if (v === ADMIN_PW) { S.modal = null; S.view = 'gateCodes'; S.gateOut = ''; render(); toast('管理员已进入'); }
    else { toast('口令不对'); }
  } else if (m.type === 'renamePaper') {
    const v = ($('#mprName') || {}).value.trim();
    const pr = (DB.papers || []).find(x => x.id === m.id);
    if (pr && v) { pr.name = v; saveDB(); toast('已改名 ' + v); }
    S.modal = null; render();
  } else if (m.type === 'moveCh') {
    const f = getChapter(m.id);
    if (f) {
      const v = ($('#mfoName') || {}).value.trim();
      f.ch.folder = v;
      if (v) { f.c.folders = f.c.folders || []; if (!f.c.folders.includes(v)) f.c.folders.push(v); }
      saveDB(); toast(v ? '已移到「' + v + '」' : '已移到未分组');
    }
    S.modal = null; render();
  } else if (m.type === 'renameFolder') {
    const v = ($('#mfoName') || {}).value.trim();
    const c = getCourse(m.course);
    if (c && v) {
      c.folders = (c.folders || []).map(f => f === m.name ? v : f);
      c.chapters.forEach(ch => { if (ch.folder === m.name) ch.folder = v; });
      saveDB(); toast('文件夹已改名');
    }
    S.modal = null; render();
  } else if (m.type === 'newChapter') {
    const v = ($('#mchName') || {}).value.trim();
    const c = getCourse(m.courseId);
    if (!v) { toast('给章节起个名字'); return; }
    if (!c) { S.modal = null; render(); return; }
    if (c.chapters.some(ch => ch.name === v)) { toast('已有同名章节'); return; }
    const fo = ($('#mchFolder') || {}).value.trim();
    const ch = { id: uid(), name: v, folder: fo, questions: [] };
    c.chapters.push(ch); saveDB();
    S.chapterId = ch.id; S.courseId = c.id; S.modal = null; S.view = 'chapter'; render();
  } else if (m.type === 'renameChapter') {
    const v = ($('#mchName') || {}).value.trim();
    const f = getChapter(m.id);
    const fo = ($('#mchFolder') || {}).value;
    if (f && v) { f.ch.name = v; if (fo !== undefined) f.ch.folder = fo.trim(); saveDB(); toast('已保存'); }
    S.modal = null; render();
  } else if (m.type === 'delChapter') {
    const f = getChapter(m.id);
    if (f) {
      f.c.chapters = f.c.chapters.filter(ch => ch.id !== m.id);
      DB.logs = DB.logs.filter(l => l.chapterId !== m.id);
      saveDB();
      S.modal = null; S.view = 'course'; S.courseId = f.c.id; render(); toast('章节已删除');
    }
  } else if (m.type === 'delQ') {
    const f = findQ(m.qid);
    if (f) {
      f.ch.questions = f.ch.questions.filter(q => q.id !== m.qid);
      (f.q.images || []).forEach(id => { delete IMG[id]; IDB.del(id); });
      saveDB();
      S.modal = null;
      S.view = 'chapter';
      render(); toast('题目已删除');
    }
  } else if (m.type === 'editExp') {
    const v = ($('#mExp') || {}).value;
    const f = findQ(m.qid);
    if (f) {
      f.q.exp = v.trim();
      f.q.hl = (m.q && m.q.hl || []).map(h => ({ s: Math.max(0, Math.min(h.s, f.q.exp.length)), e: Math.max(0, Math.min(h.e, f.q.exp.length)), c: h.c })).filter(h => h.e > h.s);
      saveDB(); toast('解析已更新');
    }
    S.modal = null; render();
  } else if (m.type === 'newType') {
    const name = ($('#ntName') || {}).value.trim();
    if (!name) { toast('先给题型起个名字'); return; }
    const builtin = ['单选题', '多选题', '判断题', '简答题', '单选', '多选', '判断', '简答'];
    if (builtin.indexOf(name) > -1 || DB.types.some(t => t.name === name)) { toast('这个名字已经有了'); return; }
    const base = m.base === 'short' ? 'short' : 'single';
    DB.types.push({ id: uid(), name, base });
    saveDB();
    if (!m.back) { S.modal = null; render(); toast('题型「' + name + '」已添加'); return; }
    const q = m.back.q;
    q.name = name; q.type = base;
    if (base === 'short') { q.options = []; q.answer = ''; }
    if (base === 'single' && q.options.length < 2) q.options = [{ k: 'A', t: '' }, { k: 'B', t: '' }, { k: 'C', t: '' }, { k: 'D', t: '' }];
    S.modal = { type: 'editQ', q, isNew: m.back.isNew, ctx: m.back.ctx };
    render();
    toast('题型「' + name + '」已添加');
  } else if (m.type === 'editQ') {
    saveEditor();
  }
}

/* 下载 */
function download(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* 问号讲解 */
function askText(q, picked) {
  const lines = [];
  lines.push('【题目】' + q.q);
  if (q.type !== 'short') q.options.forEach(o => lines.push(o.k + '. ' + o.t));
  lines.push('【正确答案】' + answerText(q));
  if (picked) lines.push('【我的选择】' + picked);
  lines.push('【解析】' + (q.exp || '（这道题还没有解析）'));
  lines.push('');
  lines.push('请按这道题给我讲讲考点、我为什么错，以及容易混淆的地方。');

let dCtx = null, dRect = null, dDrawing = false, dLast = null, dSaveT = null;
function draftKey(qid) { return 'draft_' + qid; }
function mountDraft() {
  const cv = document.getElementById('draftCv');
  if (!cv || !S.draftQ) return;
  const layer = cv.parentElement;
  const w = Math.max(1, layer.clientWidth), h = Math.max(1, layer.clientHeight - 0);
  const dpr = Math.min(2, window.devicePixelRatio || 1.5);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  dCtx = cv.getContext('2d');
  dCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dCtx.lineWidth = 2.4; dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.strokeStyle = '#c0392b';
  dRect = cv.getBoundingClientRect();
  const saved = IMG[draftKey(S.draftQ)];
  if (saved) {
    const im = new Image();
    im.onload = () => { try { dCtx.drawImage(im, 0, 0, w, h); } catch (e) {} };
    im.src = saved;
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.onpointerdown = e => {
    e.preventDefault(); cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    dDrawing = true; dLast = pos(e);
  };
  cv.onpointermove = e => {
    if (!dDrawing || !dCtx) return;
    e.preventDefault();
    const p2 = pos(e);
    dCtx.beginPath(); dCtx.moveTo(dLast.x, dLast.y); dCtx.lineTo(p2.x, p2.y); dCtx.stroke();
    dLast = p2;
  };
  const end = () => {
    if (!dDrawing) return;
    dDrawing = false;
    clearTimeout(dSaveT);
    dSaveT = setTimeout(saveDraft, 260);
  };
  cv.onpointerup = end; cv.onpointercancel = end; cv.onpointerleave = end;
  window.addEventListener('resize', relayoutDraft, { once: true });
}
function saveDraft() {
  const cv = document.getElementById('draftCv');
  if (!cv || !S.draftQ) return;
  try {
    const url = cv.toDataURL('image/png');
    IMG[draftKey(S.draftQ)] = url;
    IDB.put(draftKey(S.draftQ), url);
  } catch (e) {}
}
function relayoutDraft() {
  if (!S.draftQ || !dCtx) return;
  const cv = document.getElementById('draftCv');
  if (!cv) return;
  saveDraft();
  mountDraft();
}

/* 标记态：按住题干拖动选字（不依赖系统长按选择） */
function caretRangeAt(x, y) {
  try {
    if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
    if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (!p) return null;
      const r = document.createRange();
      r.setStart(p.offsetNode, p.offset);
      r.collapse(true);
      return r;
    }
  } catch (err) { return null; }
  return null;
}

let mkDrag = null;
document.addEventListener('pointerdown', e => {
  if (!document.getElementById('markBar')) return;
  const stem = e.target.closest('.p-stem');
  if (!stem) return;
  const r = caretRangeAt(e.clientX, e.clientY);
  if (!r) return;
  stem.classList.add('marking');
  mkDrag = { stem, a: r };
  const sel = window.getSelection();
  const rg = document.createRange();
  rg.setStart(r.startContainer, r.startOffset); rg.collapse(true);
  sel.removeAllRanges(); sel.addRange(rg);
  if (e.cancelable) e.preventDefault();
}, { passive: false });

document.addEventListener('pointermove', e => {
  if (!mkDrag) return;
  const b = caretRangeAt(e.clientX, e.clientY);
  if (!b) return;
  try {
    const sel = window.getSelection();
    const rg = document.createRange();
    if (mkDrag.a.compareBoundaryPoints(Range.START_TO_START, b) <= 0) {
      rg.setStart(mkDrag.a.startContainer, mkDrag.a.startOffset);
      rg.setEnd(b.startContainer, b.startOffset);
    } else {
      rg.setStart(b.startContainer, b.startOffset);
      rg.setEnd(mkDrag.a.startContainer, mkDrag.a.startOffset);
    }
    sel.removeAllRanges(); sel.addRange(rg);
  } catch (err) {}
}, { passive: true });

['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { mkDrag = null; }, true));

  };
  DB.courses.push(course);
  DB.profile = { major: '儿科学', grade: '大三' };
  saveDB();
  S.courseId = course.id; S.view = 'course'; render();
  toast('示例已导入：生理学 · 2 章 5 题');
}

/* 码管理：搜索框输入时只刷新列表，不整页重绘 */
document.addEventListener('input', e => {
  if (!e.target || e.target.id !== 'gateSearch') return;
  S.gateQ = e.target.value;
  const box = document.getElementById('gateList');
  if (box) box.innerHTML = gateListHTML();
});

/* 门禁：输入框回车直接进 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t && t.id === 'gateCode') { e.preventDefault(); const b = document.querySelector('[data-act=gateEnter]'); if (b) b.click(); }
  if (t && t.id === 'gatePw') { e.preventDefault(); const b = document.querySelector('[data-act=modalOk]'); if (b) b.click(); }
});

/* 启动 */
(async () => {
  await IDB.init();
  await IDB.loadAll();
  if (GATE.code) {
    const r = gateOK(GATE.code);
    if (!r || r.__fail) {
      localStorage.removeItem('quiz_gate_v1');
      GATE = { code: '', name: '', at: 0 };
      setTimeout(() => toast('这个码已到期或已停用，请联系饼干'), 400);
    }
  }
  render();
  if (GATE.code && (!DB.profile.major || !DB.profile.grade)) {
    S.modal = { type: 'profile' };
    render();
  }
})();
</script>
</body>
</html>
