    ${R.revealed ? `
      <div class="recite-ans">
        ${q.type === 'short' ? `<div class="ra-head">参考答案</div><div class="ra-short">${q.exp ? expHTML(q.exp, q.hl) : '这道题还没有参考答案。'}</div>` : `<div class="ra-head">答案<b>${esc(answerText(q))}</b></div>${q.exp ? `<div class="exp"><span class="exp-label">解析</span>${expHTML(q.exp, q.hl)}</div>` : '<div class="ra-short muted">这道题还没有解析。</div>'}`}
      </div>`
      : `<div class="opts"><div class="short-box">先自己过一遍，再点“看答案”核对。</div></div>`}
  </div>

  <div class="p-foot">
    <button class="btn" data-act="recitePrev" ${R.idx === 0 ? 'disabled' : ''}>上一题</button>
    <button class="btn primary" data-act="reciteToggle">${R.revealed ? '收起答案' : '看答案'}</button>
    <button class="btn" data-act="reciteNext">${R.idx + 1 === total ? '背完了' : '下一题'}</button>
  </div>
  `;
}

function savePreview() {
  const pv = S.preview;
  if (!pv || !pv.questions.length) { toast('没有可保存的题目'); return; }
  const place = pv.place;
  let course = DB.courses.find(c => c.name === place.course && c.major === place.major && c.grade === place.grade);
  if (!course) {
    course = { id: uid(), name: place.course, major: place.major, grade: place.grade, createdAt: Date.now(), chapters: [] };
    DB.courses.push(course);
  }
  let chapter = course.chapters.find(ch => ch.name === place.chapter);
  if (!chapter) {
    chapter = { id: uid(), name: place.chapter, questions: [] };
    course.chapters.push(chapter);
  }
  const added = pv.questions.length;
  pv.questions.forEach(q => {
    chapter.questions.push({
      id: uid(), name: q.name || '', type: q.type, q: q.q, options: q.options || [], answer: q.answer || '',
      exp: q.exp || '', hl: (q.hl || []).slice(), images: (q.images || []).slice(), st: { right: 0, wrong: 0, last: 0 }
    });
  });
  saveDB();
  const cid = course.id, chid = chapter.id;
  S.preview = null;
  S.chapterId = chid;
  startPractice(chapter.questions.slice(), { title: place.course + ' · ' + place.chapter, courseId: cid, chapterId: chid });
  toast('已存入《' + place.course + ' / ' + place.chapter + '》，共 ' + added + ' 题');
}

/* ================= 题目编辑器 ================= */
function openEditQ(q, isNew, ctx) {
  S.modal = { type: 'editQ', q: JSON.parse(JSON.stringify(q)), isNew, ctx };
  render();
}

function collectEditor() {
  const m = S.modal;
  if (!m || m.type !== 'editQ') return;
  const q = m.q;
  const body = $('#mQ');
  if (body) q.q = body.value;
  const rows = $$('.opt-edit-row');
  if (q.type !== 'judge' && rows.length) {
    q.options = rows.map(r => ({ k: r.dataset.k, t: (r.querySelector('input') || {}).value || '' }));
  }
  const exp = $('#mExp');
  if (exp) q.exp = exp.value;
}

function normalizeQ(q) {
  if (q.type === 'judge') {
    q.options = [{ k: 'A', t: '正确' }, { k: 'B', t: '错误' }];
    q.answer = q.answer === 'B' ? 'B' : 'A';
  }
  if (q.type === 'short') { q.options = []; q.answer = ''; }
  if (q.type === 'single') q.answer = (q.answer || '').slice(0, 1);
  if (q.type === 'multi') q.answer = (q.answer || '').split('').filter(x => /[A-H]/.test(x)).sort().join('');
  return q;
}

function saveEditor() {
  const m = S.modal;
  if (!m || m.type !== 'editQ') return;
  collectEditor();
  const q = normalizeQ(m.q);
  q.q = q.q.trim();
  q.hl = (q.hl || []).map(h => ({ s: Math.max(0, Math.min(Number(h.s) || 0, q.exp.length)), e: Math.max(0, Math.min(Number(h.e) || 0, q.exp.length)), c: h.c })).filter(h => h.e > h.s);
  if (!q.q) { toast('题干不能为空'); return; }
  if (q.type !== 'short') {
    q.options = q.options.filter(o => o.t.trim());
    if (q.options.length < 2) { toast('至少要有两个选项'); return; }
    if (!q.answer) { toast('记得选正确答案'); return; }
    if (q.type === 'judge') q.options = [{ k: 'A', t: '正确' }, { k: 'B', t: '错误' }];
    q.options = q.options.map((o, i) => ({ k: String.fromCharCode(65 + i), t: o.t.trim() }));
    if (q.type === 'multi') q.answer = q.answer.split('').filter(x => x.charCodeAt(0) - 65 < q.options.length).sort().join('');
    if (!q.answer) { toast('答案超出了选项范围'); return; }
  }
  const ctx = m.ctx;
  if (ctx.kind === 'preview') {
    S.preview.questions[ctx.idx] = q;
  } else if (ctx.kind === 'new') {
    const f = getChapter(ctx.chapterId);
    if (f) {
      f.ch.questions.push({ id: uid(), name: q.name || '', type: q.type, q: q.q, options: q.options, answer: q.answer, exp: q.exp, hl: q.hl || [], images: q.images, st: { right: 0, wrong: 0, last: 0 } });
      saveDB();
    }
  } else if (ctx.kind === 'db') {
    const f = findQ(ctx.qid);
    if (f) {
      const old = f.q;
      old.name = q.name || ''; old.type = q.type; old.q = q.q; old.options = q.options; old.answer = q.answer; old.exp = q.exp; old.hl = q.hl || [];
      old.images = q.images;
      saveDB();
    }
  }
  S.modal = null;
  render();
  toast('已保存');
}

/* ================= 交互 ================= */
function go(view) { S.view = view; S.modal = null; if (view === 'import') S.impMode = 'q'; render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'overlayClose') {
    if (e.target === el) { S.modal = null; render(); }
    return;
  }

  switch (act) {
    case 'go': go(el.dataset.view); break;
    case 'goSearch': S.view = 'search'; S.searchTab = 'kw'; S.modal = null; render(); break;
    case 'goDates': S.view = 'search'; S.searchTab = 'date'; S.date = todayStr(); S.modal = null; render(); break;
    case 'goBook': S.view = 'book'; S.bookTab = el.dataset.tab || 'wrong'; S.bookCourse = ''; S.modal = null; render(); break;
    case 'bookTab': S.bookTab = el.dataset.t; render(); break;
    case 'bookCourse': S.bookCourse = el.dataset.id || ''; render(); break;
    case 'practiceBook': {
      const arr = bookList().map(x => x.q);
      if (!arr.length) { toast('这里还没有题'); break; }
      startPractice(arr, { title: ({ wrong: '错题', right: '做对过', done: '做过的', fav: '收藏' }[S.bookTab] || '练习') + ' · ' + arr.length + ' 题', mode: 'book' });
      break;
    }
    case 'courseWrong': {
      const c = getCourse(el.dataset.id);
      if (c) { S.view = 'book'; S.bookTab = 'wrong'; S.bookCourse = c.id; S.modal = null; render(); }
      break;
    }
    case 'courseSheet': {
      const c = getCourse(el.dataset.id);
      if (c) { S.modal = { type: 'courseSheet', id: c.id }; render(); }
      break;
    }
    case 'courseImport': {
      const c = getCourse(S.modal.id);
      S.modal = null;
      if (c) { S.imp = { major: c.major, grade: c.grade, course: c.name }; S.view = 'import'; render(); }
      break;
    }
    case 'courseNewChapter': { const cid = S.modal.id; S.modal = { type: 'newChapter', courseId: cid }; render(); break; }
    case 'courseRename': { const c = getCourse(S.modal.id); S.modal = null; if (c) { S.modal = { type: 'renameCourse', id: c.id, value: c.name }; render(); } const i = $('#mcName'); if (i) { i.focus(); i.select(); } break; }
    case 'courseDel': { const c = getCourse(S.modal.id); if (c) { S.modal = { type: 'delCourse', id: c.id, value: c.name, count: qCount(c) }; render(); } break; }
    case 'searchTab': S.searchTab = el.dataset.t; render(); break;

    case 'editProfile': S.modal = { type: 'profile' }; render(); break;
    case 'pickMajor': {
      const i = $('#pfMajor'); if (i) i.value = el.dataset.v;
      $$('.seg button[data-act=pickMajor]').forEach(b => b.classList.toggle('on', b === el));
      break;
    }
    case 'pickGrade': {
      $$('.seg button[data-act=pickGrade]').forEach(b => b.classList.toggle('on', b === el));
      break;
    }

    case 'openCourse': S.courseId = el.dataset.id; S.view = 'course'; S.modal = null; render(); break;
    case 'openChapter': S.chapterId = el.dataset.id; S.qFilter = 'all'; S.view = 'chapter'; S.modal = null; render(); break;
    case 'openQ': {
      if (S.favAt && Date.now() - S.favAt < 500) break;
      const f = findQ(el.dataset.qid);
      if (!f) { toast('题目已删除'); break; }
      S.qid = el.dataset.qid; S.chapterId = f.ch.id; S.view = 'qdetail'; S.modal = null; render(); break;
    }
    case 'openLog': {
      const l = DB.logs.find(x => x.id === el.dataset.id);
      if (l) { S.view = 'search'; S.searchTab = 'date'; S.date = dstr(l.at); render(); }
      break;
    }

    case 'newCourse': S.modal = { type: 'newCourse' }; render(); break;
    case 'renameCourse': {
      const c = getCourse(el.dataset.id);
      if (c) { S.modal = { type: 'renameCourse', id: c.id, value: c.name }; render(); setTimeout(() => { const i = $('#mcName'); if (i) { i.focus(); i.select(); } }, 60); }
      break;
    }
    case 'delCourse': {
      const c = getCourse(el.dataset.id);
      if (c) { S.modal = { type: 'delCourse', id: c.id, value: c.name, count: qCount(c) }; render(); }
      break;
    }
    case 'newChapter': S.modal = { type: 'newChapter', courseId: el.dataset.course || S.courseId }; render(); break;
    case 'renameChapter': {
      const f = getChapter(el.dataset.id);
      if (f) { S.modal = { type: 'renameChapter', id: f.ch.id, value: f.ch.name, folder: f.ch.folder || '', courseId: f.c.id }; render(); setTimeout(() => { const i = $('#mchName'); if (i) { i.focus(); i.select(); } }, 60); }
      break;
    }
    case 'delChapter': {
      const f = getChapter(el.dataset.id);
      if (f) { S.modal = { type: 'delChapter', id: f.ch.id, value: f.ch.name, count: f.ch.questions.length }; render(); }
      break;
    }

    case 'qFilter': S.qFilter = el.dataset.f; render(); break;

    case 'goImport': {
      const imp = { major: DB.profile.major, grade: DB.profile.grade };
      if (el.dataset.course) { const c = getCourse(el.dataset.course); if (c) { imp.course = c.name; imp.major = c.major; imp.grade = c.grade; } }
      if (el.dataset.chapter) { const f = getChapter(el.dataset.chapter); if (f) { imp.course = f.c.name; imp.chapter = f.ch.name; imp.major = f.c.major; imp.grade = f.c.grade; } }
      S.imp = imp; S.view = 'import'; S.modal = null; render(); break;
    }
    case 'backImport': S.view = 'import'; S.preview = null; render(); break;
    case 'parsePaste': parsePaste(); break;

    case 'delPreviewQ': S.preview.questions.splice(Number(el.dataset.idx), 1); render(); toast('还剩 ' + S.preview.questions.length + ' 题'); break;
    case 'editPreviewQ': {
      const q = S.preview.questions[Number(el.dataset.idx)];
      if (q) openEditQ(q, false, { kind: 'preview', idx: Number(el.dataset.idx) });
      break;
    }
    case 'addPreviewImg': S.imgTarget = S.preview.questions[Number(el.dataset.idx)]; $('#imgFile').click(); break;
    case 'savePreview': savePreview(); break;

    case 'newQ': coverNewQ(el.dataset.chapter); break;
    case 'editQ': {
      const f = findQ(el.dataset.qid);
      if (f) openEditQ(f.q, false, { kind: 'db', qid: f.q.id });
      break;
    }
    case 'delQ': {
      const f = findQ(el.dataset.qid);
      if (f) { S.modal = { type: 'delQ', qid: f.q.id, q: f.q }; render(); }
      break;
    }
    case 'editExp': {
      const f = findQ(el.dataset.qid);
      if (f) { S.modal = { type: 'editExp', qid: f.q.id, exp: f.q.exp }; render(); }
      break;
    }
    case 'addImg': {
      const f = findQ(el.dataset.qid);
      if (f) { S.imgTarget = f.q; $('#imgFile').click(); }
      break;
    }
    case 'addImages': {
      const m = S.modal;
      if (m && m.type === 'editQ') { collectEditor(); S.imgTarget = m.q; $('#imgFile').click(); }
      break;
    }
    case 'delImage': {
      const m = S.modal;
      if (m && m.type === 'editQ') {
        collectEditor();
        const id = el.dataset.id;
        m.q.images = (m.q.images || []).filter(x => x !== id);
        delete IMG[id];
        IDB.del(id);
        render();
      }
      break;
    }
    case 'setQType': {
      collectEditor();
      const q = S.modal.q;
      const sel = el.dataset.t;
      if (sel === selectedTypeId(q)) break;
      let t = sel;
      if (sel.indexOf('c:') === 0) {
        const def = DB.types.find(x => x.id === sel.slice(2));
        if (!def) break;
        q.name = def.name;
        t = def.base;
      } else {
        q.name = '';
      }
      q.type = t;
      if (t === 'judge') { q.options = [{ k: 'A', t: '正确' }, { k: 'B', t: '错误' }]; if (q.answer !== 'A' && q.answer !== 'B') q.answer = 'A'; }
      if (t === 'short') { q.answer = ''; }
      if ((t === 'single' || t === 'multi') && q.options.length < 2) q.options = [{ k: 'A', t: '' }, { k: 'B', t: '' }, { k: 'C', t: '' }, { k: 'D', t: '' }];
      if (t === 'single' && q.answer.length > 1) q.answer = q.answer.slice(0, 1);
      render();
      break;
    }
    case 'setAns': {
      collectEditor();
      const q = S.modal.q;
      const k = el.dataset.k;
      if (q.type === 'multi') {
        q.answer = q.answer.indexOf(k) > -1 ? q.answer.split('').filter(x => x !== k).join('') : (q.answer + k).split('').sort().join('');
      } else {
        q.answer = k;
      }
      render();
      break;
    }
    case 'newType': {
      const cur = S.modal;
      let back = null;
      if (cur && cur.type === 'editQ') { collectEditor(); back = { q: cur.q, isNew: cur.isNew, ctx: cur.ctx }; }
      S.modal = { type: 'newType', name: '', base: 'single', back };
      render();
      setTimeout(() => { const i = $('#ntName'); if (i) i.focus(); }, 60);
      break;
    }
    case 'pickTypeBase': {
      const i = $('#ntName');
      if (i) S.modal.name = i.value;
      S.modal.base = el.dataset.v;
      render();
      break;
    }
    case 'delType': {
      DB.types = DB.types.filter(x => x.id !== el.dataset.id);
      saveDB(); render(); toast('题型已删除');
      break;
    }
    case 'addOption': {
      collectEditor();
      const q = S.modal.q;
      if (q.options.length >= 8) { toast('最多 8 个选项'); break; }
      q.options.push({ k: String.fromCharCode(65 + q.options.length), t: '' });
      render();
      break;
    }
    case 'delOption': {
      collectEditor();
      const q = S.modal.q;
      const k = el.dataset.k;
      q.options = q.options.filter(o => o.k !== k);
      if (q.answer.indexOf(k) > -1) q.answer = '';
      render();
      break;
    }

    case 'toggleFav': { toggleFav(el.dataset.qid); break; }
    case 'askQ': {
      const f = findQ(el.dataset.qid);
      if (!f) { toast('题目已删除'); break; }
      const q = f.q;
      S.modal = {
        type: 'issue', qid: q.id, has: !!q.issue,
        kinds: q.issue && q.issue.kinds ? q.issue.kinds.slice() : [],
        note: q.issue ? (q.issue.note || '') : ''
      };
      render();
      break;
    }
    case 'hlColor': {
      const m = S.modal;
      if (!m || m.type !== 'editQ') break;
      const ta = $('#mExp');
      if (ta) m.q.exp = ta.value;
      if (!hlSel || hlSel.e <= hlSel.s) { toast('先用手指按住选中要标重点的文字'); break; }
      m.q.hl = m.q.hl || [];
      m.q.hl.push({ s: hlSel.s, e: Math.min(hlSel.e, m.q.exp.length), c: el.dataset.c || 'y' });
      refreshHLPreview();
      break;
    }
    case 'hlClear': {
      const m = S.modal;
      if (!m || m.type !== 'editQ') break;
      m.q.hl = [];
      refreshHLPreview();
      toast('高光已清除');
      break;
    }
    case 'issueKind': {
      const m = S.modal;
      if (!m || m.type !== 'issue') break;
      const box = $('#issueNote');
      if (box) m.note = box.value;
      const k = el.dataset.k;
      const i = m.kinds.indexOf(k);
      if (i > -1) m.kinds.splice(i, 1); else m.kinds.push(k);
      render();
      break;
    }
    case 'issueSubmit': {
      const m = S.modal;
      if (!m || m.type !== 'issue') break;
      const box = $('#issueNote');
      if (box) m.note = box.value;
      if (!m.kinds.length && !String(m.note || '').trim()) { toast('先点一下问题类型，或者写句说明'); break; }
      const f = findQ(m.qid);
      if (f) {
        f.q.issue = { kinds: m.kinds.slice(), note: String(m.note || '').trim(), at: Date.now() };
        saveDB();
      }
      S.modal = null;
      render();
      toast('已记录，可在错题本「反馈」里找到');
      break;
    }
    case 'issueClear': {
      const m = S.modal;
      if (m && m.type === 'issue') {
        const f = findQ(m.qid);
        if (f) { f.q.issue = null; saveDB(); }
      }
      S.modal = null;
      render();
      toast('已删除这条反馈');
      break;
    }

    case 'practiceOne': {
      const f = findQ(el.dataset.qid);
      if (f) startPractice([f.q], { title: f.c.name + ' · ' + f.ch.name, courseId: f.c.id, chapterId: f.ch.id, mode: 'one' });
      break;
    }
    case 'practiceSheet': {
      const chapterId = el.dataset.chapter || null;
      const courseId = el.dataset.course || null;
      const arr = practiceList(courseId, chapterId);
      if (!arr.length) { toast('这里还没有题目'); break; }
      const loc = chapterId ? getChapter(chapterId) : null;
      const c = getCourse(courseId);
      const title = loc ? (loc.c.name + ' · ' + loc.ch.name) : (c ? c.name : '练习');
      openCover({ base: arr, title, courseId, chapterId });
      break;
    }
    case 'coverFilter': { S.cover.filter = el.dataset.f; render(); break; }
    case 'coverOrder': { S.cover.order = el.dataset.v === 'random' ? 'random' : 'seq'; render(); break; }
    case 'coverStart': startFromCover(-1); break;
    case 'coverJump': startFromCover(Number(el.dataset.i) || 0); break;
    case 'coverClose': {
      const C = S.cover;
      S.cover = null;
      S.view = C && C.chapterId ? 'chapter' : (C && C.courseId ? 'course' : 'home');
      render();
      break;
    }
    case 'toggleRandom': S.randomPref = !S.randomPref; render(); break;
    case 'startPractice': {
      const sc = S.modal.scope;
      const mode = el.dataset.scope;
      let arr = practiceList(sc.courseId, sc.chapterId);
      if (mode === 'obj') arr = arr.filter(q => q.type !== 'short');
      else if (mode === 'sub') arr = arr.filter(q => q.type === 'short');
      else if (mode === 'wrong') arr = arr.filter(q => q.st.wrong > 0);
      if (!arr.length) { toast('这个范围里没有题目'); break; }
      S.modal = null;
      startPractice(arr, { title: sc.title, courseId: sc.courseId, chapterId: sc.chapterId, mode, random: S.randomPref });
      break;
    }

    case 'impMode': S.impMode = el.dataset.m === 'exp' ? 'exp' : 'q'; render(); break;
    case 'impModeGo': S.impMode = el.dataset.m === 'exp' ? 'exp' : 'q'; S.view = 'import'; render(); break;
    case 'applyExpPaste': applyExpPaste(); break;
    case 'gotoChapter': S.modal = null; S.view = 'chapter'; S.chapterId = el.dataset.id; render(); break;
    case 'goPaper': S.view = 'paper'; S.modal = null; render(); break;
    case 'paperScope': paperState().scope = el.dataset.v; render(); break;
    case 'paperSrc': paperState().src = el.dataset.v; render(); break;
    case 'paperShare': {
      const ps = paperState();
      ps.share = Number(el.dataset.v);
      const t = Math.max(0, (Number(ps.objN) || 0) + (Number(ps.subN) || 0)) || 90;
      ps.objN = Math.round(t * ps.share);
      ps.subN = Math.max(0, t - ps.objN);
      render();
      break;
    }
    case 'paperCourse': paperState().courseId = el.value; paperState().chapterId = ''; render(); break;
    case 'paperChapter': paperState().chapterId = el.value; render(); break;
    case 'paperQuick': {
      const ps = paperState();
      const t = Number(el.dataset.v);
      ps.objN = Math.round(t * ps.share); ps.subN = t - ps.objN;
      render();
      break;
    }
    case 'paperCount': {
      const ps = paperState();
      const t = Math.max(1, Number(el.value) || 90);
      ps.objN = Math.round(t * ps.share); ps.subN = t - ps.objN;
      render();
      break;
    }
    case 'paperObjN': { const ps = paperState(); ps.objN = Math.max(0, Number(el.value) || 0); render(); break; }
    case 'paperSubN': { const ps = paperState(); ps.subN = Math.max(0, Number(el.value) || 0); render(); break; }
    case 'genPaper': genPaper(); break;
    case 'recitePaper': recitePaper(); break;
    case 'exportPaper': exportPaper(el.dataset.exp === '1'); break;
    case 'reciteChapter': {
      const f = getChapter(el.dataset.id);
      if (!f || !f.ch.questions.length) { toast('这一章还没有题目'); break; }
      S.modal = null;
      startRecite(f.ch.questions.slice(), f.c.name + ' · ' + f.ch.name);
      break;
    }
    case 'exitRecite': {
      S.recite = null;
      S.view = S.chapterId ? 'chapter' : 'home';
      render();
      break;
    }
    case 'reciteToggle': if (S.recite) { S.recite.revealed = !S.recite.revealed; render(); } break;
    case 'recitePrev': if (S.recite && S.recite.idx > 0) { S.recite.idx--; S.recite.revealed = false; render(); } break;
    case 'reciteNext': {
      const R2 = S.recite;
      if (!R2) break;
      if (R2.idx + 1 >= R2.list.length) { toast('背完 ' + R2.list.length + ' 题了'); S.view = 'home'; S.recite = null; render(); break; }
      R2.idx++; R2.revealed = false; render(); break;
    }
    case 'openPalette': if (S.practice) { S.modal = { type: 'palette' }; render(); } break;
    case 'jumpTo': {
      const P = S.practice;
      if (P) {
        P.idx = Number(el.dataset.i) || 0;
        P.picked = null; P.multiSel = []; P.submitted = false; P.revealed = false; P.judged = null; P.correct = null;
      }
      S.modal = null; render(); break;
    }
    case 'paperFinish': S.modal = null; if (S.practice) finish(); break;

    case 'pick': pick(el.dataset.k); break;
    case 'submitMulti': submitMulti(); break;
    case 'reveal': reveal(); break;
    case 'self': selfJudge(Number(el.dataset.ok) === 1); break;
    case 'next': advance(); break;
    case 'exitPractice': {
      const P = S.practice;
      if (P && P.chapterId) { S.view = 'chapter'; S.chapterId = P.chapterId; }
      else if (P && P.courseId) { S.view = 'course'; S.courseId = P.courseId; }
      else S.view = 'home';
      S.practice = null; render();
      break;
    }
    case 'exitResult': {
      const P = S.practice;
      if (P && P.chapterId) { S.view = 'chapter'; S.chapterId = P.chapterId; }
      else S.view = 'home';
      render();
      break;
    }
    case 'restart': {
      const P = S.practice;
      if (P) startPractice(P.list.slice(), { title: P.title, courseId: P.courseId, chapterId: P.chapterId, mode: P.mode });
      break;
    }
    case 'practiceWrong': {
      const P = S.practice, R = S.result;
      const list = R.wrongItems.map(i => i.q);
      if (!list.length) { toast('没有错题'); break; }
      startPractice(list, { title: P.title + ' · 错题', courseId: P.courseId, chapterId: P.chapterId, mode: 'wrong' });
      break;
    }

    case 'downloadTemplate': {
      download('题目模板.txt', '1. 题干可以写多行，第二行也会接在题干后面\nA. 选项一\nB. 选项二\nC. 选项三\nD. 选项四\n答案：A\n解析：解析可以写多行，直到下一题为止。\n\n2. 肝素通过增强抗凝血酶Ⅲ活性发挥抗凝作用。\nA. 正确\nB. 错误\n答案：A\n解析：判断题写成正确 / 错误就行。\n\n3. 简述肝素的抗凝机制。\n答案：肝素与抗凝血酶Ⅲ结合，使其活性增强，加速灭活凝血酶及 Xa 因子。\n');
      break;
    }
    case 'fillTemplate': {
      const t = $('#pasteText');
      if (t) {
        t.value = '一、单选题\n1. 条件致病菌的准确含义是？\nA. 任何时候都致病的细菌\nB. 正常菌群在特定条件下与宿主关系失衡而致病\nC. 只感染动物的细菌\nD. 只存在于体外的细菌\n答案：B\n解析：正常菌群在免疫力下降、菌群移位或菌群失调时才致病。\n\n2. 心室肌细胞动作电位平台期主要由哪种离子流形成？\nA. Na+ 快内流\nB. Ca2+ 缓慢内流与 K+ 外流\nC. Cl- 外流\nD. K+ 内流\n答案：B\n解析：平台期由 L 型钙通道的 Ca2+ 缓慢内流与钾外流共同维持。\n\n二、多选题\n3. 下列属于条件致病菌的有？\nA. 大肠埃希菌\nB. 金黄色葡萄球菌\nC. 结核分枝杆菌\nD. 铜绿假单胞菌\n答案：ABD\n解析：三者都是正常菌群或环境菌，在特定条件下致病。\n\n三、判断题\n4. 肝素通过增强抗凝血酶Ⅲ的活性发挥抗凝作用。\nA. 正确\nB. 错误\n答案：A\n解析：正确，这是肝素抗凝的核心机制。\n\n四、简答题\n5. 简述肝素的抗凝机制。\n答案：肝素与抗凝血酶Ⅲ结合，使其构象改变、活性显著增强，从而加速灭活凝血酶及 Xa 等凝血因子。\n';
        t.focus();
        toast('已填入示例，可以直接点“解析这段文字”');
      }
      break;
    }
    case 'demo': demo(); break;

    case 'modalClose': S.modal = null; render(); break;
    case 'modalOk': modalOk(); break;
  }
});

function currentProfileGrade() {
  const on = $('.seg button.on[data-act="pickGrade"]');
  return on ? on.dataset.v : '';
}

function modalOk() {
  const m = S.modal;
  if (!m) return;
  if (m.type === 'profile') {
    const major = ($('#pfMajor') || {}).value.trim();
    const grade = currentProfileGrade();
    if (!major) { toast('先填写专业'); return; }
    if (!grade) { toast('点一个年级'); return; }
    DB.profile = { major, grade };
    saveDB(); S.modal = null; render(); toast('已切换为 ' + major + ' · ' + grade);
  } else if (m.type === 'newCourse') {
    const name = ($('#ncName') || {}).value.trim();
    const major = ($('#ncMajor') || {}).value.trim() || DB.profile.major;
    const grade = ($('#ncGrade') || {}).value || DB.profile.grade;
    if (!name) { toast('给科目起个名字'); return; }
    if (DB.courses.some(c => c.name === name && c.major === major && c.grade === grade)) { toast('这个专业年级下已经有同名科目'); return; }
    const c = { id: uid(), name, major, grade, createdAt: Date.now(), chapters: [] };
    DB.courses.push(c); saveDB();
    S.courseId = c.id; S.modal = null; S.view = 'course'; render();
  } else if (m.type === 'renameCourse') {
    const v = ($('#mcName') || {}).value.trim();
    const c = getCourse(m.id);
    if (c && v) { c.name = v; saveDB(); toast('已重命名'); }
    S.modal = null; render();
  } else if (m.type === 'delCourse') {
    DB.courses = DB.courses.filter(c => c.id !== m.id);
    DB.logs = DB.logs.filter(l => l.courseId !== m.id);
    saveDB(); S.modal = null; S.view = 'browse'; render(); toast('已删除');
  } else if (m.type === 'newChapter') {
    const v = ($('#mchName') || {}).value.trim();
    const c = getCourse(m.courseId);
    if (!v) { toast('给章节起个名字'); return; }
    if (!c) { S.modal = null; render(); return; }
    if (c.chapters.some(ch => ch.name === v)) { toast('已有同名章节'); return; }
    const fo = ($('#mchFolder') || {}).value.trim();
    const ch = { id: uid(), name: v, folder: fo, questions: [] };
    c.chapters.push(ch); saveDB();
    S.chapterId = ch.id; S.courseId = c.id; S.modal = null; S.view = 'chapter'; render();
  } else if (m.type === 'renameChapter') {
    const v = ($('#mchName') || {}).value.trim();
    const f = getChapter(m.id);
    const fo = ($('#mchFolder') || {}).value;
    if (f && v) { f.ch.name = v; if (fo !== undefined) f.ch.folder = fo.trim(); saveDB(); toast('已保存'); }
    S.modal = null; render();
  } else if (m.type === 'delChapter') {
    const f = getChapter(m.id);
    if (f) {
      f.c.chapters = f.c.chapters.filter(ch => ch.id !== m.id);
      DB.logs = DB.logs.filter(l => l.chapterId !== m.id);
      saveDB();
      S.modal = null; S.view = 'course'; S.courseId = f.c.id; render(); toast('章节已删除');
    }
  } else if (m.type === 'delQ') {
    const f = findQ(m.qid);
    if (f) {
      f.ch.questions = f.ch.questions.filter(q => q.id !== m.qid);
      (f.q.images || []).forEach(id => { delete IMG[id]; IDB.del(id); });
      saveDB();
      S.modal = null;
      S.view = 'chapter';
      render(); toast('题目已删除');
    }
  } else if (m.type === 'editExp') {
    const v = ($('#mExp') || {}).value;
    const f = findQ(m.qid);
    if (f) { f.q.exp = v.trim(); saveDB(); toast('解析已更新'); }
    S.modal = null; render();
  } else if (m.type === 'newType') {
    const name = ($('#ntName') || {}).value.trim();
    if (!name) { toast('先给题型起个名字'); return; }
    const builtin = ['单选题', '多选题', '判断题', '简答题', '单选', '多选', '判断', '简答'];
    if (builtin.indexOf(name) > -1 || DB.types.some(t => t.name === name)) { toast('这个名字已经有了'); return; }
    const base = m.base === 'short' ? 'short' : 'single';
    DB.types.push({ id: uid(), name, base });
    saveDB();
    if (!m.back) { S.modal = null; render(); toast('题型「' + name + '」已添加'); return; }
    const q = m.back.q;
    q.name = name; q.type = base;
    if (base === 'short') { q.options = []; q.answer = ''; }
    if (base === 'single' && q.options.length < 2) q.options = [{ k: 'A', t: '' }, { k: 'B', t: '' }, { k: 'C', t: '' }, { k: 'D', t: '' }];
    S.modal = { type: 'editQ', q, isNew: m.back.isNew, ctx: m.back.ctx };
    render();
    toast('题型「' + name + '」已添加');
  } else if (m.type === 'editQ') {
    saveEditor();
  }
}

/* 下载 */
function download(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* 问号讲解 */
function askText(q, picked) {
  const lines = [];
  lines.push('【题目】' + q.q);
  if (q.type !== 'short') q.options.forEach(o => lines.push(o.k + '. ' + o.t));
  lines.push('【正确答案】' + answerText(q));
  if (picked) lines.push('【我的选择】' + picked);
  lines.push('【解析】' + (q.exp || '（这道题还没有解析）'));
  lines.push('');
  lines.push('请按这道题给我讲讲考点、我为什么错，以及容易混淆的地方。');
  return lines.join('\n');
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => toast('已复制，去豆包粘贴就能问')).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}

function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? '已复制，去豆包粘贴就能问' : '复制失败，长按文字手动复制');
}

/* 解析高光编辑 */
let hlSel = null;
function refreshHLPreview() {
  const m = S.modal;
  const pv = document.getElementById('hlPreview');
  const ta = document.getElementById('mExp');
  if (!pv || !m || m.type !== 'editQ') return;
  const text = ta ? ta.value : m.q.exp;
  const hl = (m.q.hl || []).filter(h => h.e <= text.length);
  pv.innerHTML = text ? expHTML(text, hl) : '<span class="muted">（解析还空着）</span>';
  hlSel = null;
}
document.addEventListener('selectionchange', () => {
  const m = S.modal;
  if (!m || m.type !== 'editQ') return;
  const pv = document.getElementById('hlPreview');
  const sel = window.getSelection();
  if (!pv || !sel || !sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  if (!pv.contains(r.commonAncestorContainer)) return;
  const pre = document.createRange();
  pre.selectNodeContents(pv);
  try { pre.setEnd(r.startContainer, r.startOffset); } catch (e) { return; }
  const s0 = pre.toString().length;
  const len = r.toString().length;
  if (len > 0) hlSel = { s: s0, e: s0 + len };
});

/* 长按收藏 */
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-favq]')) e.preventDefault(); });
let favTimer = null, favStart = null;
function toggleFav(qid) {
  const f = findQ(qid);
  if (!f) return;
  f.q.fav = !f.q.fav;
  saveDB();
  render();
  toast(f.q.fav ? '已收藏，可在首页「收藏题」里做' : '已取消收藏');
}
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-favq]');
  if (!t) return;
  favStart = { x: e.clientX, y: e.clientY, id: t.dataset.favq };
  clearTimeout(favTimer);
  favTimer = setTimeout(() => {
    if (!favStart) return;
    S.favAt = Date.now();
    toggleFav(favStart.id);
    favStart = null;
  }, 560);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
  document.addEventListener(ev, () => { clearTimeout(favTimer); favStart = null; }, true);
});
document.addEventListener('pointermove', e => {
  if (!favStart) return;
  if (Math.abs(e.clientX - favStart.x) > 8 || Math.abs(e.clientY - favStart.y) > 8) { clearTimeout(favTimer); favStart = null; }
});

/* 输入 */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'kw') {
    S.keyword = t.value;
    const box = $('#searchResults');
    if (box) box.innerHTML = searchResultsHTML();
  }
  if (t.id === 'mExp' && S.modal && S.modal.type === 'editQ') { refreshHLPreview(); }
  if (t.id === 'datePick') {
    S.date = t.value || todayStr();
    const box = $('#searchResults');
    if (box) box.innerHTML = searchResultsHTML();
  }
});

/* 文件选择 */
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.act === 'paperObjN') { paperState().objN = Math.max(0, Number(e.target.value) || 0); render(); return; }
  if (e.target.dataset && e.target.dataset.act === 'paperSubN') { paperState().subN = Math.max(0, Number(e.target.value) || 0); render(); return; }
  if (e.target.dataset && e.target.dataset.act === 'paperCount') {
    const ps = paperState();
    const t = Math.max(1, Number(e.target.value) || 90);
    ps.objN = Math.round(t * (ps.share == null ? 0.9 : ps.share));
    ps.subN = t - ps.objN;
    render();
    return;
  }
  if (e.target.id === 'file') {
    handleFiles(e.target.files);
    e.target.value = '';
  }
  if (e.target.id === 'imgFile') {
    handleImages(e.target.files, S.imgTarget);
    e.target.value = '';
    S.imgTarget = null;
  }
});

/* 拖拽导入 */
document.addEventListener('dragover', e => { if (S.view === 'import') e.preventDefault(); });
document.addEventListener('drop', e => {
  if (S.view !== 'import') return;
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

/* 键盘 */
document.addEventListener('keydown', e => {
  if (S.modal) {
    if (e.key === 'Escape') { S.modal = null; render(); }
    return;
  }
  if (S.view === 'recite') {
    const R = S.recite; if (!R) return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!R.revealed) R.revealed = true;
      else if (R.idx + 1 < R.list.length) { R.idx++; R.revealed = false; }
      render();
    }
    return;
  }
  if (S.view !== 'practice') return;
  const P = S.practice; if (!P) return;
  const q = curQ(); if (!q) return;
  if (q.type === 'short') return;
  const k = String(e.key || '').toUpperCase();
  if (/^[A-H]$/.test(k) && q.options.some(o => o.k === k)) { e.preventDefault(); pick(k); return; }
  if ((e.key === 'Enter' || e.key === ' ') && (P.picked !== null || P.submitted)) { e.preventDefault(); advance(); }
});
